

<style>
  :root {
    --rainbow-bg: #fbf7fb;
    --rainbow-panel: rgba(255, 255, 255, 0.78);
    --rainbow-panel-strong: rgba(255, 255, 255, 0.92);
    --rainbow-border: rgba(72, 54, 75, 0.10);
    --rainbow-text: #2d2730;
    --rainbow-muted: #7f7485;
    --rainbow-soft-pink: #f7dce9;
    --rainbow-soft-lavender: #ebe4ff;
    --rainbow-soft-peach: #ffe9dd;
    --rainbow-shadow: 0 18px 45px rgba(67, 47, 77, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    color: var(--rainbow-text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at top left, rgba(247, 220, 233, 0.85), transparent 34%),
      radial-gradient(circle at top right, rgba(235, 228, 255, 0.9), transparent 32%),
      linear-gradient(135deg, #fffafd 0%, #f8f3fb 48%, #fff8f4 100%);
  }

  .rainbow-homepage-shell {
    display: grid;
    grid-template-columns: 248px minmax(0, 1fr);
    min-height: 100vh;
  }

  .rainbow-sidebar {
    padding: 26px 18px;
    border-right: 1px solid var(--rainbow-border);
    background: rgba(255, 255, 255, 0.48);
    backdrop-filter: blur(20px);
  }

  .rainbow-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 10px 28px;
  }

  .rainbow-brand-mark {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 16px;
    font-weight: 800;
    color: #7c3f63;
    background: linear-gradient(135deg, var(--rainbow-soft-pink), var(--rainbow-soft-lavender));
    box-shadow: 0 12px 30px rgba(146, 92, 126, 0.18);
  }

  .rainbow-brand-title {
    font-size: 17px;
    font-weight: 750;
    letter-spacing: -0.02em;
  }

  .rainbow-brand-subtitle,
  .rainbow-card-label,
  .rainbow-eyebrow,
  .rainbow-nav-section,
  .rainbow-muted {
    color: var(--rainbow-muted);
  }

  .rainbow-brand-subtitle {
    font-size: 12px;
    margin-top: 2px;
  }

  .rainbow-nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .rainbow-nav-section {
    padding: 20px 12px 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.11em;
    font-weight: 700;
  }

  .rainbow-nav-item {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 11px 12px;
    text-align: left;
    color: #4a404d;
    background: transparent;
    font: inherit;
    cursor: default;
  }

  .rainbow-nav-item.is-active {
    background: rgba(255, 255, 255, 0.82);
    box-shadow: inset 0 0 0 1px rgba(72, 54, 75, 0.06), 0 10px 24px rgba(67, 47, 77, 0.06);
    font-weight: 700;
  }

  .rainbow-homepage-main {
    padding: 34px 36px 28px;
    min-width: 0;
  }

  .rainbow-homepage-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 24px;
  }

  .rainbow-eyebrow,
  .rainbow-card-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 800;
  }

  h1,
  h2 {
    margin: 0;
    letter-spacing: -0.035em;
  }

  h1 {
    margin-top: 6px;
    font-size: 34px;
    line-height: 1.05;
  }

  h2 {
    margin-top: 5px;
    font-size: 17px;
    line-height: 1.2;
  }

  .rainbow-search-wrap {
    flex: 0 1 430px;
  }

  .rainbow-search {
    width: 100%;
    height: 46px;
    border: 1px solid var(--rainbow-border);
    border-radius: 999px;
    padding: 0 18px;
    outline: none;
    color: var(--rainbow-text);
    background: rgba(255, 255, 255, 0.76);
    box-shadow: 0 12px 30px rgba(67, 47, 77, 0.06);
    font: inherit;
  }

  .rainbow-card {
    border: 1px solid var(--rainbow-border);
    border-radius: 24px;
    background: var(--rainbow-panel);
    box-shadow: var(--rainbow-shadow);
    backdrop-filter: blur(18px);
  }

  .rainbow-kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }

  .rainbow-kpi-card {
    padding: 18px;
    min-height: 108px;
  }

  .rainbow-kpi-value {
    margin-top: 12px;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .rainbow-homepage-content-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 18px;
    align-items: start;
  }

  .rainbow-homepage-primary {
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-width: 0;
  }

  .rainbow-homepage-rail {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .rainbow-two-column-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
  }

  .rainbow-section-card,
  .rainbow-status-card {
    padding: 18px;
  }

  .rainbow-section-header {
    display: flex;
    justify-content: space-between;
    align-items: start;
    gap: 14px;
    margin-bottom: 14px;
  }

  .rainbow-priority-toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 16px;
    color: #7d6f83;
    font-size: 12px;
    font-weight: 750;
  }

  .rainbow-priority-toolbar-link {
    color: #8a3f63;
    text-decoration: none;
  }

  .rainbow-priority-toolbar-select {
    border: 1px solid rgba(72, 54, 75, 0.10);
    border-radius: 10px;
    padding: 7px 10px;
    background: rgba(255, 255, 255, 0.76);
    color: #4a404d;
    font-size: 12px;
    font-weight: 750;
  }

  .rainbow-muted {
    font-size: 12px;
    white-space: nowrap;
  }

  .rainbow-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .rainbow-priority-list {
    gap: 0;
    overflow: hidden;
    border-top: 1px solid rgba(72, 54, 75, 0.07);
  }

  .rainbow-list-item {
    display: block;
    padding: 13px 14px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.62);
    border: 1px solid rgba(72, 54, 75, 0.07);
    color: inherit;
    text-decoration: none;
  }

  .rainbow-list-item:visited,
  .rainbow-list-item:hover,
  .rainbow-list-item:active {
    color: inherit;
    text-decoration: none;
  }

  .rainbow-list-item--clickable {
    cursor: pointer;
    transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease, background 120ms ease;
  }

  .rainbow-list-item--clickable:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 34px rgba(84, 55, 86, 0.09);
    border-color: rgba(157, 105, 153, 0.28);
    background: rgba(255, 255, 255, 0.82);
  }

  .rainbow-list-title {
    font-weight: 750;
    font-size: 14px;
    line-height: 1.25;
  }

  .rainbow-list-meta {
    margin-top: 5px;
    color: var(--rainbow-muted);
    font-size: 12px;
    line-height: 1.35;
  }

  .rainbow-priority-row {
    display: grid;
    grid-template-columns: minmax(230px, 1.25fr) minmax(190px, 0.9fr) minmax(150px, 0.65fr) minmax(126px, auto);
    align-items: center;
    gap: 18px;
    padding: 15px 8px;
    border-bottom: 1px solid rgba(72, 54, 75, 0.07);
    color: inherit;
    text-decoration: none;
  }

  .rainbow-priority-row:visited,
  .rainbow-priority-row:hover,
  .rainbow-priority-row:active {
    color: inherit;
    text-decoration: none;
  }

  .rainbow-priority-row--clickable {
    cursor: pointer;
  }

  .rainbow-priority-row--clickable:hover {
    background: rgba(255, 255, 255, 0.52);
  }

  .rainbow-priority-dot {
    width: 11px;
    height: 11px;
    flex: 0 0 auto;
    border-radius: 999px;
    background: linear-gradient(135deg, #f472b6, #fb7185);
    box-shadow: 0 0 0 4px rgba(244, 114, 182, 0.12);
  }

  .rainbow-priority-dot--risk {
    background: linear-gradient(135deg, #f97316, #fb7185);
    box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.12);
  }

  .rainbow-priority-dot--healthy {
    background: linear-gradient(135deg, #14b8a6, #86efac);
    box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.12);
  }

  .rainbow-priority-identity {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }

  .rainbow-priority-name {
    font-size: 14px;
    font-weight: 800;
    line-height: 1.2;
    color: #2d2730;
  }

  .rainbow-priority-subtitle {
    margin-top: 5px;
    color: var(--rainbow-muted);
    font-size: 12px;
    line-height: 1.25;
  }

  .rainbow-priority-context {
    min-width: 0;
  }

  .rainbow-priority-due {
    color: #db2777;
    font-size: 12px;
    font-weight: 850;
    line-height: 1.25;
  }

  .rainbow-priority-note {
    margin-top: 5px;
    color: #536076;
    font-size: 12px;
    line-height: 1.3;
  }

  .rainbow-priority-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    align-items: center;
  }

  .rainbow-priority-tag {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 750;
    line-height: 1;
    border: 1px solid rgba(72, 54, 75, 0.08);
    background: rgba(255, 255, 255, 0.68);
    color: #5f5563;
  }

  .rainbow-priority-tag--workspace {
    background: rgba(247, 220, 233, 0.64);
    border-color: rgba(214, 129, 171, 0.22);
    color: #8a3f63;
  }

  .rainbow-priority-tag--condition {
    background: rgba(235, 228, 255, 0.68);
    border-color: rgba(139, 116, 219, 0.20);
    color: #5d4a91;
  }

  .rainbow-priority-tag--alert {
    background: rgba(255, 233, 221, 0.78);
    border-color: rgba(228, 138, 96, 0.22);
    color: #8a4b2e;
  }

  .rainbow-priority-tag--health {
    background: rgba(255, 247, 237, 0.88);
    border-color: rgba(245, 158, 11, 0.22);
    color: #92400e;
  }

  .rainbow-priority-action {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    min-width: 0;
  }

  .rainbow-priority-action-label {
    display: none;
  }

  .rainbow-priority-open {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    padding: 9px 12px;
    background: rgba(247, 220, 233, 0.72);
    color: #9d174d;
    font-size: 12px;
    font-weight: 850;
    white-space: nowrap;
  }

  .rainbow-stale-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 14px;
    padding: 14px 8px;
    border-bottom: 1px solid rgba(72, 54, 75, 0.07);
    color: inherit;
    text-decoration: none;
    overflow: hidden;
  }

  .rainbow-stale-row:visited,
  .rainbow-stale-row:hover,
  .rainbow-stale-row:active {
    color: inherit;
    text-decoration: none;
  }

  .rainbow-stale-row--clickable {
    cursor: pointer;
  }

  .rainbow-stale-row--clickable:hover {
    background: rgba(255, 255, 255, 0.52);
  }

  .rainbow-stale-main {
    min-width: 0;
  }

  .rainbow-stale-title {
    font-size: 14px;
    font-weight: 800;
    line-height: 1.2;
    color: #2d2730;
  }

  .rainbow-stale-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .rainbow-stale-tag {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 750;
    line-height: 1;
    border: 1px solid rgba(72, 54, 75, 0.08);
    background: rgba(235, 228, 255, 0.68);
    color: #5d4a91;
  }

  .rainbow-stale-tag--health {
    background: rgba(255, 247, 237, 0.88);
    border-color: rgba(245, 158, 11, 0.22);
    color: #92400e;
  }

  .rainbow-stale-tag--owner {
    background: rgba(247, 220, 233, 0.64);
    border-color: rgba(214, 129, 171, 0.22);
    color: #8a3f63;
  }

  .rainbow-stale-meta {
    margin-top: 7px;
    color: var(--rainbow-muted);
    font-size: 12px;
    line-height: 1.35;
  }

  .rainbow-stale-summary {
    margin-top: 5px;
    color: #536076;
    font-size: 12px;
    line-height: 1.35;
  }

  .rainbow-stale-side {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    min-width: 92px;
  }

  .rainbow-stale-days {
    color: #db2777;
    font-size: 12px;
    font-weight: 850;
    white-space: nowrap;
  }

  .rainbow-stale-open {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    padding: 8px 11px;
    background: rgba(247, 220, 233, 0.72);
    color: #9d174d;
    font-size: 12px;
    font-weight: 850;
    white-space: nowrap;
  }

  .rainbow-alert-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 12px;
    padding: 14px 8px;
    border-bottom: 1px solid rgba(72, 54, 75, 0.07);
    color: inherit;
    text-decoration: none;
    overflow: hidden;
  }
  .rainbow-alert-row:hover {
    background: rgba(255, 255, 255, 0.52);
  }
  .rainbow-alert-title {
    font-size: 14px;
    font-weight: 800;
    color: #2d2730;
    line-height: 1.2;
  }
  .rainbow-alert-meta {
    margin-top: 5px;
    color: var(--rainbow-muted);
    font-size: 12px;
    line-height: 1.3;
    max-width: 100%;
  }
  .rainbow-alert-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
    max-width: 100%;
  }
  .rainbow-alert-tag {
    display: inline-flex;
    max-width: 100%;
    border-radius: 999px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 750;
    line-height: 1.05;
    background: rgba(255, 233, 221, 0.78);
    border: 1px solid rgba(228, 138, 96, 0.22);
    color: #8a4b2e;
  }
  .rainbow-alert-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: fit-content;
    max-width: 100%;
    border-radius: 12px;
    padding: 8px 11px;
    background: rgba(247, 220, 233, 0.72);
    color: #9d174d;
    font-size: 12px;
    font-weight: 850;
    white-space: nowrap;
  }

  .rainbow-alert-group {
    padding: 14px;
    border-radius: 20px;
    border: 1px solid rgba(72, 54, 75, 0.08);
    background: rgba(255, 255, 255, 0.58);
    box-shadow: 0 12px 28px rgba(67, 47, 77, 0.05);
  }

  .rainbow-alert-group--missing-intake-data {
    background: linear-gradient(135deg, rgba(247, 220, 233, 0.62), rgba(255, 255, 255, 0.70));
  }

  .rainbow-alert-group--claims-needing-review {
    background: linear-gradient(135deg, rgba(235, 228, 255, 0.66), rgba(255, 255, 255, 0.70));
  }

  .rainbow-alert-group--workflow-blockers {
    background: linear-gradient(135deg, rgba(255, 233, 221, 0.72), rgba(255, 255, 255, 0.70));
  }

  .rainbow-alert-group--compliance-administrative,
  .rainbow-alert-group--other-alerts {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.66), rgba(235, 228, 255, 0.48));
  }

  .rainbow-alert-group-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
  }

  .rainbow-alert-group-label {
    color: var(--rainbow-muted);
    font-size: 10px;
    font-weight: 850;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .rainbow-alert-group-title {
    margin-top: 4px;
    color: #2d2730;
    font-size: 15px;
    font-weight: 850;
    letter-spacing: -0.025em;
    line-height: 1.2;
  }

  .rainbow-alert-group-subtitle {
    margin-top: 4px;
    color: var(--rainbow-muted);
    font-size: 12px;
    font-weight: 650;
    line-height: 1.3;
  }

  .rainbow-alert-group-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 36px;
    height: 32px;
    padding: 0 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.74);
    border: 1px solid rgba(72, 54, 75, 0.08);
    color: #8a3f63;
    font-size: 13px;
    font-weight: 900;
    box-shadow: 0 8px 18px rgba(67, 47, 77, 0.05);
  }

  .rainbow-alert-chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 12px;
  }

  .rainbow-alert-chip {
    display: inline-flex;
    align-items: center;
    max-width: 100%;
    border-radius: 999px;
    padding: 5px 8px;
    background: rgba(255, 255, 255, 0.66);
    border: 1px solid rgba(72, 54, 75, 0.08);
    color: #5f5563;
    font-size: 11px;
    font-weight: 750;
    line-height: 1.05;
  }

  .rainbow-alert-group-items {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
  }

  .rainbow-alert-mini-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    padding: 10px 11px;
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.54);
    border: 1px solid rgba(72, 54, 75, 0.06);
    color: inherit;
    text-decoration: none;
  }

  .rainbow-alert-mini-row:visited,
  .rainbow-alert-mini-row:hover,
  .rainbow-alert-mini-row:active {
    color: inherit;
    text-decoration: none;
  }

  .rainbow-alert-mini-row--clickable {
    cursor: pointer;
    transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease, background 120ms ease;
  }

  .rainbow-alert-mini-row--clickable:hover {
    transform: translateY(-1px);
    background: rgba(255, 255, 255, 0.82);
    border-color: rgba(157, 105, 153, 0.22);
    box-shadow: 0 12px 26px rgba(84, 55, 86, 0.08);
  }

  .rainbow-alert-mini-title {
    color: #2d2730;
    font-size: 13px;
    font-weight: 850;
    line-height: 1.2;
  }

  .rainbow-alert-mini-meta {
    margin-top: 4px;
    color: var(--rainbow-muted);
    font-size: 11px;
    font-weight: 650;
    line-height: 1.3;
  }

  .rainbow-alert-mini-action {
    color: #9d174d;
    font-size: 11px;
    font-weight: 850;
    white-space: nowrap;
  }

  .rainbow-alert-group-more {
    padding: 4px 2px 0;
    color: var(--rainbow-muted);
    font-size: 11px;
    font-weight: 750;
    line-height: 1.3;
  }

  .rainbow-alert-main {
    min-width: 0;
  }

  .rainbow-alert-side {
    min-width: 0;
    justify-self: end;
  }

  .rainbow-empty-state {
    padding: 18px;
    border-radius: 18px;
    color: var(--rainbow-muted);
    background: rgba(255, 255, 255, 0.45);
    border: 1px dashed rgba(72, 54, 75, 0.14);
    font-size: 13px;
    line-height: 1.45;
  }

  .rainbow-status-strip {
    margin-top: 10px;
    padding: 12px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.58);
    color: #5e5363;
    font-size: 13px;
    line-height: 1.45;
  }

  
  @media (max-width: 900px) {
    .rainbow-priority-row {
      grid-template-columns: 1fr;
      gap: 10px;
      padding: 15px 4px;
    }

    .rainbow-priority-action {
      justify-content: flex-start;
    }

    .rainbow-stale-row {
      grid-template-columns: 1fr;
    }

    .rainbow-stale-side {
      align-items: flex-start;
    }

    .rainbow-alert-mini-row {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 1100px) {
    .rainbow-homepage-shell {
      grid-template-columns: 1fr;
    }

    .rainbow-sidebar {
      display: none;
    }

    .rainbow-homepage-content-grid {
      grid-template-columns: 1fr;
    }

    .rainbow-kpi-grid,
    .rainbow-two-column-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 720px) {
    .rainbow-homepage-main {
      padding: 22px 16px;
    }

    .rainbow-homepage-header {
      flex-direction: column;
      align-items: stretch;
    }

    .rainbow-kpi-grid,
    .rainbow-two-column-grid {
