<script>
  let homepageData = null;
  const RAINBOW_DASHBOARD_WEB_APP_URL = 'https://script.google.com/a/macros/rbwatl.com/s/AKfycbzX9Mvyr2zk1GkBR2Nfdv9PE994onOVpxQpJj9lq3j87n2NN_iZ3eRWDFWlbfmrvpNoFw/exec';

  document.addEventListener('DOMContentLoaded', function() {
    bindHomepageNavRoutes();
    loadHomepageData();
  });

  function bindHomepageNavRoutes() {
    document.querySelectorAll('[data-homepage-route]').forEach(function(button) {
      button.addEventListener('click', function() {
        const targetRoute = button.getAttribute('data-homepage-route');

        if (targetRoute) {
          navigateToRainbowRoute_(targetRoute);
        }
      });
    });
  }

  function loadHomepageData() {
    google.script.run
      .withSuccessHandler(handleHomepageDataLoaded)
      .withFailureHandler(handleHomepageDataError)
      .getHomepageSummary();
  }

  function handleHomepageDataLoaded(response) {
    if (!response || !response.success) {
      handleHomepageDataError(response || { message: 'Unknown homepage error.' });
      return;
    }

    const rawHomepageData = response.data || {};
    homepageData = rawHomepageData.data || rawHomepageData;

    console.log('Rainbow Phase 8D homepage payload keys:', Object.keys(homepageData));
    console.log('Rainbow Phase 8D ownershipVisibility:', homepageData.ownershipVisibility);
    console.log('Rainbow Phase 8D conditionsVisibility:', homepageData.conditionsVisibility);

    const ownershipVisibility = getHomepageOwnershipVisibilityForRender_(homepageData);
    const conditionsVisibility = getHomepageConditionsVisibilityForRender_(homepageData);

    renderKpis(homepageData.kpis || {});
    renderTodayPriorities(homepageData.todayPriorities || []);
    renderBecomingStale(homepageData.becomingStale || []);
    renderOperationalAlerts(homepageData.operationalAlerts || []);
    renderRecentActivity(homepageData.recentActivity || []);
    renderOwnershipVisibility(ownershipVisibility);
    renderConditionsVisibility(conditionsVisibility);
    renderComplianceVisibility(homepageData.complianceVisibility || {});
    renderRecentClaimSummaries(homepageData.recentClaimSummaries || []);
    renderTodaySchedule(homepageData.todaySchedule || []);

    const statusStrip = document.getElementById('systemStatusStrip');
    if (statusStrip) {
      const loadedClaimCount = homepageData.activeClaimCount || homepageData.claimSummaryCount || homepageData.claimCount || homepageData.totalClaimCount || 0;
      const recentActivityCount = Array.isArray(homepageData.recentActivity) ? homepageData.recentActivity.length : 0;
      const scheduleCount = Array.isArray(homepageData.todaySchedule) ? homepageData.todaySchedule.length : 0;

      statusStrip.textContent = 'Phase 8D script active • Homepage connected • ' + loadedClaimCount + ' claims loaded • ' + recentActivityCount + ' recent activity • ' + scheduleCount + ' schedule items • ' + ownershipVisibility.length + ' ownership areas • ' + conditionsVisibility.length + ' condition groups';
    }
  }

  function handleHomepageDataError(error) {
    console.error(error);

    const statusStrip = document.getElementById('systemStatusStrip');
    if (statusStrip) {
      statusStrip.textContent = 'Homepage data load failed.';
    }
  }

  function getHomepageOwnershipVisibilityForRender_(data) {
    if (Array.isArray(data.ownershipVisibility) && data.ownershipVisibility.length > 0) {
      return data.ownershipVisibility;
    }

    const sourceItems = [];
    ['recentClaimSummaries', 'todayPriorities', 'becomingStale'].forEach(function(key) {
      if (Array.isArray(data[key])) {
        data[key].forEach(function(item) {
          sourceItems.push(item);
        });
      }
    });

    const summary = {};

    sourceItems.forEach(function(item) {
      const ownershipArea = item.ownershipArea || item.Ownership_Area || 'Unassigned';
      const claimId = item.claimId || item.Claim_ID || item.claimDisplayName || '';
      const healthLevel = item.healthLevel || item.operationalHealth || item.Operational_Health || 'Healthy';

      if (!summary[ownershipArea]) {
        summary[ownershipArea] = {
          ownershipArea: ownershipArea,
          activeClaimCount: 0,
          needsAttentionCount: 0,
          criticalCount: 0,
          escalatedCount: 0,
          atRiskCount: 0,
          claimIds: {}
        };
      }

      if (claimId && !summary[ownershipArea].claimIds[claimId]) {
        summary[ownershipArea].claimIds[claimId] = true;
        summary[ownershipArea].activeClaimCount++;
      }

      if (['Attention Soon', 'At Risk', 'Escalated', 'Critical'].indexOf(healthLevel) !== -1) {
        summary[ownershipArea].needsAttentionCount++;
      }

      if (healthLevel === 'Critical') summary[ownershipArea].criticalCount++;
      if (healthLevel === 'Escalated') summary[ownershipArea].escalatedCount++;
      if (healthLevel === 'At Risk') summary[ownershipArea].atRiskCount++;
    });

    return Object.keys(summary).map(function(key) {
      const item = summary[key];
      delete item.claimIds;
      return item;
    }).sort(function(a, b) {
      return b.activeClaimCount - a.activeClaimCount;
    });
  }

  function getHomepageConditionsVisibilityForRender_(data) {
    if (Array.isArray(data.conditionsVisibility) && data.conditionsVisibility.length > 0) {
      return data.conditionsVisibility;
    }

    const priorities = Array.isArray(data.todayPriorities) ? data.todayPriorities : [];
    const summary = {};

    priorities.forEach(function(item) {
      const conditionType = item.conditionType || item.Condition_Type || '';

      if (!conditionType) {
        return;
      }

      if (!summary[conditionType]) {
        summary[conditionType] = {
          conditionType: conditionType,
          openCount: 0,
          affectedClaimIds: {}
        };
      }

      summary[conditionType].openCount++;

      if (item.claimId) {
        summary[conditionType].affectedClaimIds[item.claimId] = true;
      }
    });

    return Object.keys(summary).map(function(key) {
      const item = summary[key];
      return {
        conditionType: item.conditionType,
        openCount: item.openCount,
        affectedClaimCount: Object.keys(item.affectedClaimIds).length
      };
    }).sort(function(a, b) {
      return b.openCount - a.openCount;
    });
  }

  function renderKpis(kpis) {
    setKpiValue('activeClaims', kpis.activeClaims || homepageData.activeClaimCount || homepageData.claimSummaryCount || 0);
    setKpiValue('recentActivityClaims', kpis.recentActivityClaims || homepageData.recentActivityClaimCount || homepageData.recentActivityClaims || 0);
    setKpiValue('timelineEvents', kpis.timelineEvents || homepageData.timelineEventCount || homepageData.timelineEventsCount || 0);
    setKpiValue('openComplianceActions', kpis.openComplianceActions || homepageData.openComplianceActionCount || homepageData.openComplianceActionsCount || 0);
  }

  function setKpiValue(kpiName, value) {
    const element = document.querySelector('[data-kpi="' + kpiName + '"]');
    if (element) {
      element.textContent = value || 0;
    }
  }

  function renderTodayPriorities(items) {
    const groupedItems = groupHomepagePrioritiesByClaim_(items || []);
    document.getElementById('todayPrioritiesCount').textContent = groupedItems.length + ' items';
    renderPriorityList_('todayPrioritiesList', groupedItems);
  }

  function groupHomepagePrioritiesByClaim_(items) {
    const grouped = {};
    const order = [];

    (items || []).forEach(function(item) {
      const key = item.claimId || item.targetId || item.claimDisplayName || item.title || 'priority';

      if (!grouped[key]) {
        grouped[key] = Object.assign({}, item, {
          _priorityTitles: [],
          _conditionTypes: [],
          _alertTypes: []
        });
        order.push(key);
      }

      if (item.title && grouped[key]._priorityTitles.indexOf(item.title) === -1) {
        grouped[key]._priorityTitles.push(item.title);
      }

      if (item.conditionType && grouped[key]._conditionTypes.indexOf(item.conditionType) === -1) {
        grouped[key]._conditionTypes.push(item.conditionType);
      }

      if (item.alertType && grouped[key]._alertTypes.indexOf(item.alertType) === -1) {
        grouped[key]._alertTypes.push(item.alertType);
      }

      if (!grouped[key].reason && item.reason) {
        grouped[key].reason = item.reason;
      }

      if (!grouped[key].healthLevel && item.healthLevel) {
        grouped[key].healthLevel = item.healthLevel;
      }

      if (!grouped[key].ownershipArea && item.ownershipArea) {
        grouped[key].ownershipArea = item.ownershipArea;
      }

      if (!grouped[key].targetRoute && item.targetRoute) {
        grouped[key].targetRoute = item.targetRoute;
      }
    });

    return order.map(function(key) {
      return grouped[key];
    });
  }

  function buildHomepagePriorityTags_(item) {
    const tags = [];
    const seen = {};

    function addTag(label, type) {
      const normalizedLabel = String(label || '').trim();
      if (!normalizedLabel || seen[normalizedLabel]) {
        return;
      }

      seen[normalizedLabel] = true;
      tags.push({
        label: normalizedLabel,
        type: type || 'default'
      });
    }

    addTag(item.ownershipArea || item.primaryOwner, 'workspace');

    (item._conditionTypes || []).forEach(function(conditionType) {
      addTag(conditionType, 'condition');
    });

    if (item.conditionType) {
      addTag(item.conditionType, 'condition');
    }

    (item._alertTypes || []).forEach(function(alertType) {
      addTag(alertType, 'alert');
    });

    if (item.alertType) {
      addTag(item.alertType, 'alert');
    }

    addTag(item.healthLevel, 'health');

    if (tags.length === 0 && item.type) {
      addTag(item.type, 'condition');
    }

    return tags.slice(0, 3);
  }

  function renderPriorityList_(containerId, items) {
    const container = document.getElementById(containerId);

    if (!container) return;

    const normalizedItems = Array.isArray(items) ? items : [];

    if (normalizedItems.length === 0) {
      container.innerHTML = '<div class="rainbow-empty-state">No operational priorities require action right now.</div>';
      return;
    }

    container.innerHTML = normalizedItems.map(function(item, index) {
      const isNavigable = !!(item && item.targetRoute);
      const itemClass = isNavigable
        ? 'rainbow-priority-row rainbow-priority-row--clickable'
        : 'rainbow-priority-row';
      const tags = buildHomepagePriorityTags_(item);
      const titleText = item.claimDisplayName || item.customerName || item.claimId || item.title || 'Operational priority';
      const subtitleText = [item.claimNumber || '', item.claimId || ''].filter(Boolean).join(' • ');
      const reasonText = item.reason || item.primaryReason || item.conditionType || item.alertType || item.title || 'Review this operational focus item.';
      const actionText = getHomepagePriorityActionText_(item);
      const dueText = getHomepagePriorityDueText_(item);
      const dotClass = getHomepagePriorityDotClass_(item);
      const href = isNavigable ? buildRainbowAbsoluteUrl_(item.targetRoute) : '';
      const openTag = isNavigable
        ? '<a class="' + itemClass + '" data-homepage-item-index="' + index + '" href="javascript:void(0)" data-target-url="' + escapeHtml(href) + '">'
        : '<div class="' + itemClass + '" data-homepage-item-index="' + index + '">';
      const closeTag = isNavigable ? '</a>' : '</div>';

      return [
        openTag,
        '<div class="rainbow-priority-identity">',
        '<span class="rainbow-priority-dot ' + dotClass + '"></span>',
        '<div>',
        '<div class="rainbow-priority-name">' + escapeHtml(titleText) + '</div>',
        '<div class="rainbow-priority-subtitle">' + escapeHtml(subtitleText) + '</div>',
        '</div>',
        '</div>',
        '<div class="rainbow-priority-context">',
        '<div class="rainbow-priority-tags">' + tags.map(function(tag) {
          return '<span class="rainbow-priority-tag rainbow-priority-tag--' + escapeHtml(tag.type) + '">' + escapeHtml(tag.label) + '</span>';
        }).join('') + '</div>',
        '</div>',
        '<div>',
        '<div class="rainbow-priority-due">' + escapeHtml(dueText) + '</div>',
        '<div class="rainbow-priority-note">' + escapeHtml(reasonText) + '</div>',
        '</div>',
        '<div class="rainbow-priority-action">',
        '<span class="rainbow-priority-open">' + escapeHtml(actionText) + ' →</span>',
        '</div>',
        closeTag
      ].join('');
    }).join('');

    attachHomepageListNavigation_(container, normalizedItems);
  }

  function getHomepagePriorityActionText_(item) {
    const title = String(item.title || '').toLowerCase();
    const condition = String(item.conditionType || '').toLowerCase();
    const alert = String(item.alertType || '').toLowerCase();

    if (title.indexOf('revision') !== -1 || condition.indexOf('revision') !== -1) {
      return 'Open revision';
    }

    if (alert.indexOf('xact') !== -1 || alert.indexOf('symbility') !== -1) {
      return 'Add link';
    }

    if (title.indexOf('payment') !== -1 || condition.indexOf('payment') !== -1) {
      return 'Review payment';
    }

    return 'Open claim';
  }

  function getHomepagePriorityDueText_(item) {
    if (item.followUpDate) {
      return 'Follow up due';
    }

    if (item.healthLevel === 'At Risk') {
      return 'Needs attention';
    }

    if (item.healthLevel === 'Healthy') {
      return 'Monitor';
    }

    return 'Review today';
  }

  function getHomepagePriorityDotClass_(item) {
    if (item.healthLevel === 'At Risk' || item.healthLevel === 'Escalated' || item.healthLevel === 'Critical') {
      return 'rainbow-priority-dot--risk';
    }

    if (item.healthLevel === 'Healthy') {
      return 'rainbow-priority-dot--healthy';
    }

    return '';
  }


  function renderBecomingStale(items) {
    renderSimpleList('becomingStaleList', items, function(item) {
      return item.claimDisplayName || 'Claim';
    });
  }

  function renderOperationalAlerts(items) {
    const alertItems = Array.isArray(items)
      ? items
      : (items && Array.isArray(items.topAlerts) ? items.topAlerts : []);

    const visibleItems = alertItems.slice(0, 5);
    const hiddenCount = Math.max(alertItems.length - visibleItems.length, 0);

    renderSimpleList('operationalAlertsList', visibleItems, function(item) {
      return item.alertType || item.alertCategory || 'Alert';
    }, function(item) {
      const claimText = item.claimDisplayName || item.claimId || '';
      const severityText = item.severity ? 'Severity: ' + item.severity : '';
      return [claimText, severityText].filter(Boolean).join(' • ');
    });

    if (hiddenCount > 0) {
      const container = document.getElementById('operationalAlertsList');
      if (container) {
        container.innerHTML += '<div class="rainbow-list-more">+' + hiddenCount + ' more alerts</div>';
      }
    }
  }

  function renderRecentActivity(items) {
    renderSimpleList('recentActivityList', items, function(item) {
      return item.claimDisplayName || item.claimId || 'Activity';
    }, function(item) {
      return item.title || item.summary || item.eventType || '';
    });
  }

  function renderOwnershipVisibility(items) {
    renderSimpleList('ownershipVisibilityList', items, function(item) {
      return item.ownershipArea || 'Ownership Area';
    }, function(item) {
      return (item.activeClaimCount || 0) + ' active claims • ' + (item.needsAttentionCount || 0) + ' need attention';
    });
  }

  function renderConditionsVisibility(items) {
    renderSimpleList('conditionsVisibilityList', items, function(item) {
      return item.conditionType || 'Condition';
    }, function(item) {
      return (item.openCount || 0) + ' open • ' + (item.affectedClaimCount || 0) + ' claims affected';
    });
  }

  function renderComplianceVisibility(summary) {
    const items = [];

    if (summary && typeof summary === 'object') {
      items.push({
        title: 'Open Compliance Actions',
        meta: String(summary.totalOpenComplianceActions || 0)
      });
      items.push({
        title: 'Critical Compliance Actions',
        meta: String(summary.criticalComplianceActionCount || 0)
      });
      items.push({
        title: 'Overdue Compliance Actions',
        meta: String(summary.overdueComplianceActionCount || 0)
      });
    }

    renderSimpleList('complianceVisibilityList', items, function(item) {
      return item.title;
    }, function(item) {
      return item.meta;
    });
  }

  function renderRecentClaimSummaries(items) {
    renderSimpleList('recentClaimSummariesList', items, function(item) {
      return item.claimDisplayName || item.customerName || item.claimId || 'Claim Summary';
    }, function(item) {
      return item.lastActivitySummary || item.lastActivityType || item.lifecycleState || '';
    });
  }

  function renderTodaySchedule(items) {
    renderSimpleList('todayScheduleList', items, function(item) {
      return item.title || item.claimDisplayName || item.customerName || 'Calendar Event';
    }, function(item) {
      return formatScheduleTime(item);
    });
  }

  function formatScheduleTime(item) {
    if (!item) return '';

    if (item.isAllDayEvent) {
      return 'All Day';
    }

    const startValue = item.startTime || item.time || item.scheduledTime || '';
    const endValue = item.endTime || '';

    if (!startValue) {
      return item.location || '';
    }

    const startDate = new Date(startValue);
    const endDate = endValue ? new Date(endValue) : null;

    if (isNaN(startDate.getTime())) {
      return startValue;
    }

    const startText = formatClockTime(startDate);

    if (!endDate || isNaN(endDate.getTime())) {
      return startText;
    }

    return startText + ' - ' + formatClockTime(endDate);
  }

  function formatClockTime(date) {
    return date.toLocaleTimeString([], {
      hour: 'numeric',
      minute: '2-digit'
    });
  }

  function renderSimpleList(containerId, items, titleFn, metaFn) {
    const container = document.getElementById(containerId);

    if (!container) return;

    const normalizedItems = Array.isArray(items)
      ? items
      : (items && typeof items === 'object' ? Object.values(items) : []);

    if (normalizedItems.length === 0) {
      container.innerHTML = '<div class="rainbow-empty-state">No items available.</div>';
      return;
    }

    container.innerHTML = normalizedItems.map(function(item, index) {
      const isNavigable = !!(item && item.targetRoute);
      const itemClass = isNavigable
        ? 'rainbow-list-item rainbow-list-item--clickable'
        : 'rainbow-list-item';

      const href = isNavigable
        ? buildRainbowAbsoluteUrl_(item.targetRoute)
        : '';

      const openTag = isNavigable
        ? '<a class="' + itemClass + '" data-homepage-item-index="' + index + '" href="javascript:void(0)" data-target-url="' + escapeHtml(href) + '">'
        : '<div class="' + itemClass + '" data-homepage-item-index="' + index + '">';

      const closeTag = isNavigable ? '</a>' : '</div>';

      return [
        openTag,
        '<div class="rainbow-list-title">' + escapeHtml(titleFn(item)) + '</div>',
        '<div class="rainbow-list-meta">' + escapeHtml(metaFn ? metaFn(item) : '') + '</div>',
        closeTag
      ].join('');
    }).join('');

    attachHomepageListNavigation_(container, normalizedItems);
  }

  function attachHomepageListNavigation_(container, items) {
    if (!container || !Array.isArray(items)) return;

    const elements = container.querySelectorAll('[data-homepage-item-index]');

    elements.forEach(function(element) {
      const index = Number(element.getAttribute('data-homepage-item-index'));
      const item = items[index];

      if (!item || !item.targetRoute) {
        return;
      }

      element.setAttribute('role', 'button');
      element.setAttribute('tabindex', '0');
      element.setAttribute('title', 'Open related Rainbow view');

      element.addEventListener('click', function(event) {
        event.preventDefault();
        event.stopPropagation();
        handleHomepageNavigation_(item);
        return false;
      });

      element.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          handleHomepageNavigation_(item);
        }
      });
    });
  }

  function handleHomepageNavigation_(item) {
    if (!item || !item.targetRoute) {
      return;
    }

    console.log('Rainbow homepage navigation target:', {
      targetType: item.targetType || '',
      targetId: item.targetId || '',
      targetRoute: item.targetRoute || '',
      sourceSection: item.sourceSection || ''
    });

    navigateToRainbowRoute_(item.targetRoute);
  }

  function navigateToRainbowRoute_(targetRoute) {
    if (!targetRoute) {
      return;
    }

    const targetUrl = buildRainbowAbsoluteUrl_(targetRoute);

    try {
      window.open(targetUrl, '_blank');
    } catch (error) {
      window.location.href = targetUrl;
    }
  }

  function buildRainbowAbsoluteUrl_(targetRoute) {
    const normalizedRoute = targetRoute.charAt(0) === '?'
      ? targetRoute
      : '?' + targetRoute.replace(/^\/+exec\??/, '');

    if (window.RAINBOW_DASHBOARD_WEB_APP_URL_FROM_SERVER) {
      return window.RAINBOW_DASHBOARD_WEB_APP_URL_FROM_SERVER + normalizedRoute;
    }

    return RAINBOW_DASHBOARD_WEB_APP_URL + normalizedRoute;
  }

  function showHomepageNavigationPlaceholder_(item) {
    const statusStrip = document.getElementById('systemStatusStrip');

    if (statusStrip) {
      statusStrip.textContent = 'Navigation target: ' + (item && item.targetRoute ? item.targetRoute : '?view=claimShell');
    }
  }

  function escapeHtml(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
