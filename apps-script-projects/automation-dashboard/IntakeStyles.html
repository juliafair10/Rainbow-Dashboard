<style>
  :root {
    --intake-bg: #fbf7fb;
    --intake-surface: rgba(255, 255, 255, 0.78);
    --intake-surface-strong: rgba(255, 255, 255, 0.94);
    --intake-surface-soft: rgba(255, 255, 255, 0.58);
    --intake-border: rgba(72, 54, 75, 0.10);
    --intake-text: #2d2730;
    --intake-muted: #7f7485;
    --intake-blue: #7f5fb8;
    --intake-blue-soft: rgba(235, 228, 255, 0.72);
    --intake-green: #377b5a;
    --intake-green-soft: rgba(226, 246, 234, 0.78);
    --intake-amber: #8f6a24;
    --intake-amber-soft: rgba(255, 244, 214, 0.82);
    --intake-red: #9f3f49;
    --intake-red-soft: rgba(255, 236, 239, 0.82);
    --intake-soft-pink: #f7dce9;
    --intake-soft-lavender: #ebe4ff;
    --intake-soft-peach: #ffe9dd;
    --intake-shadow: 0 18px 45px rgba(67, 47, 77, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    color: var(--intake-text);
    background:
      radial-gradient(circle at top left, rgba(247, 220, 233, 0.85), transparent 34%),
      radial-gradient(circle at top right, rgba(235, 228, 255, 0.9), transparent 32%),
      linear-gradient(135deg, #fffafd 0%, #f8f3fb 48%, #fff8f4 100%);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  button {
    font: inherit;
  }

  .intake-shell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 248px minmax(0, 1fr);
  }

  .intake-sidebar {
    padding: 26px 18px;
    border-right: 1px solid var(--intake-border);
    background: rgba(255, 255, 255, 0.48);
    backdrop-filter: blur(20px);
  }

  .intake-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 10px 28px;
  }

  .intake-brand-mark {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 16px;
    color: #7c3f63;
    background: linear-gradient(135deg, var(--intake-soft-pink), var(--intake-soft-lavender));
    box-shadow: 0 12px 30px rgba(146, 92, 126, 0.18);
    font-weight: 800;
  }

  .intake-brand-title {
    font-size: 17px;
    font-weight: 750;
    letter-spacing: -0.02em;
  }

  .intake-brand-subtitle {
    margin-top: 2px;
    color: var(--intake-muted);
    font-size: 12px;
  }

  .intake-nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .intake-nav-item {
    width: 100%;
    min-height: 42px;
    padding: 11px 12px;
    border: 0;
    border-radius: 14px;
    color: #4a404d;
    background: transparent;
    text-align: left;
    cursor: pointer;
  }

  .intake-nav-item:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.62);
    box-shadow: inset 0 0 0 1px rgba(72, 54, 75, 0.06), 0 10px 24px rgba(67, 47, 77, 0.04);
  }

  .intake-nav-item.is-active {
    color: #4a404d;
    background: rgba(255, 255, 255, 0.82);
    box-shadow: inset 0 0 0 1px rgba(72, 54, 75, 0.06), 0 10px 24px rgba(67, 47, 77, 0.06);
    font-weight: 700;
  }

  .intake-nav-item:disabled {
    color: #9aa6b6;
    cursor: not-allowed;
  }

  .intake-main {
    min-width: 0;
    padding: 34px 36px 28px;
  }

  .intake-header {
    display: flex;
    justify-content: space-between;
    align-items: start;
    gap: 20px;
    margin-bottom: 24px;
  }

  .intake-eyebrow,
  .intake-label {
    color: var(--intake-muted);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  h1,
  h2 {
    margin: 0;
    letter-spacing: -0.035em;
  }

  h1 {
    margin-top: 4px;
    font-size: 34px;
    line-height: 1.05;
  }

  h2 {
    margin-top: 3px;
    font-size: 17px;
    line-height: 1.2;
  }

  .intake-status-line {
    margin-top: 8px;
    color: var(--intake-muted);
    font-size: 13px;
    line-height: 1.4;
  }

  .intake-header-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
  }

  .intake-button,
  .intake-inline-button,
  .intake-action-button {
    border-radius: 999px;
    border: 1px solid var(--intake-border);
    cursor: pointer;
  }

  .intake-button {
    min-height: 38px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 750;
    white-space: nowrap;
  }

  .intake-button-primary {
    border-color: rgba(127, 95, 184, 0.34);
    color: #4f386b;
    background: linear-gradient(135deg, rgba(247, 220, 233, 0.92), rgba(235, 228, 255, 0.95));
    box-shadow: 0 10px 24px rgba(146, 92, 126, 0.12);
  }

  .intake-button-secondary {
    color: #263446;
    background: rgba(255, 255, 255, 0.78);
  }

  .intake-button-danger {
    border-color: #c83b31;
    color: #ffffff;
    background: var(--intake-red);
  }

  .intake-button:disabled {
    opacity: 0.62;
    cursor: wait;
  }

  .intake-health-strip {
    display: flex;
    justify-content: space-between;
    gap: 18px;
    align-items: center;
    min-height: 104px;
    padding: 18px;
    margin-bottom: 18px;
    border: 1px solid var(--intake-border);
    border-radius: 24px;
    background: var(--intake-surface);
    box-shadow: var(--intake-shadow);
    backdrop-filter: blur(18px);
  }

  .intake-health-value {
    display: inline-flex;
    align-items: center;
    min-height: 34px;
    margin-top: 6px;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 20px;
    font-weight: 800;
  }

  .intake-health-value.is-healthy,
  .intake-workflow-health.is-healthy {
    color: var(--intake-green);
    background: var(--intake-green-soft);
  }

  .intake-health-value.is-warning,
  .intake-workflow-health.is-warning {
    color: var(--intake-amber);
    background: var(--intake-amber-soft);
  }

  .intake-health-value.is-critical,
  .intake-workflow-health.is-critical {
    color: var(--intake-red);
    background: var(--intake-red-soft);
  }

  .intake-health-value.is-unavailable,
  .intake-health-value.is-loading,
  .intake-workflow-health.is-unavailable {
    color: #475569;
    background: #edf2f7;
  }

  .intake-muted {
    color: var(--intake-muted);
    font-size: 12px;
    line-height: 1.4;
  }

  .intake-health-meta {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 7px 10px;
    min-width: 310px;
    color: #2f3b4c;
    font-size: 13px;
  }

  .intake-kpi-grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }

  .intake-kpi-card {
    min-height: 108px;
    padding: 18px;
    border: 1px solid var(--intake-border);
    border-radius: 24px;
    background: var(--intake-surface);
    box-shadow: var(--intake-shadow);
    backdrop-filter: blur(18px);
  }

  .intake-kpi-value {
    margin-top: 12px;
    font-size: 32px;
    font-weight: 850;
    line-height: 1;
  }

  .intake-content-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 18px;
    align-items: start;
  }

  .intake-primary-column,
  .intake-rail {
    display: flex;
    min-width: 0;
    flex-direction: column;
    gap: 18px;
  }

  .intake-panel {
    padding: 18px;
    border: 1px solid var(--intake-border);
    border-radius: 24px;
    background: var(--intake-surface);
    box-shadow: var(--intake-shadow);
    backdrop-filter: blur(18px);
  }

  .intake-section-header {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: start;
    margin-bottom: 12px;
  }

  .intake-filter-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: -2px 0 12px;
  }

  .intake-filter-button {
    min-height: 32px;
    padding: 6px 9px;
    border: 1px solid var(--intake-border);
    border-radius: 999px;
    color: #354255;
    background: rgba(255, 255, 255, 0.68);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .intake-filter-button:hover {
    border-color: #a9bdd8;
    background: #f7fbff;
  }

  .intake-filter-button.is-active {
    border-color: rgba(157, 105, 153, 0.34);
    color: #4f386b;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 8px 22px rgba(84, 55, 86, 0.07);
  }

  .intake-workflow-list,
  .intake-issue-list,
  .intake-action-list,
  .intake-detail-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .intake-workflow-row {
    display: grid;
    grid-template-columns: minmax(190px, 1fr) auto minmax(300px, 1.4fr);
    gap: 12px;
    align-items: center;
    min-height: 82px;
    padding: 13px 14px;
    border: 1px solid rgba(77, 53, 80, 0.08);
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.62);
  }

  .intake-workflow-title {
    font-size: 14px;
    font-weight: 800;
  }

  .intake-workflow-meta {
    margin-top: 4px;
    color: var(--intake-muted);
    font-size: 12px;
  }

  .intake-workflow-healthy-note {
    color: var(--intake-muted);
    font-size: 12px;
    margin-bottom: 8px;
  }

  .intake-workflow-health {
    justify-self: start;
    min-width: 88px;
    padding: 6px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    text-align: center;
  }

  .intake-workflow-metrics {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 6px;
  }

  .intake-mini-metric {
    min-width: 0;
    padding: 9px 10px;
    border: 1px solid rgba(77, 53, 80, 0.06);
    border-radius: 14px;
    background: rgba(250, 247, 252, 0.70);
  }

  .intake-mini-metric span {
    display: block;
    color: var(--intake-muted);
    font-size: 11px;
  }

  .intake-mini-metric strong {
    display: block;
    margin-top: 3px;
    font-size: 16px;
  }

  .intake-issue-card {
    padding: 14px 16px;
    border: 1px solid rgba(77, 53, 80, 0.10);
    border-left-width: 3px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.94);
    box-shadow: 0 8px 22px rgba(84, 55, 86, 0.045);
  }

  .intake-issue-card.warning {
    border-left-color: rgba(155, 113, 44, 0.34);
  }

  .intake-issue-card.critical {
    border-left-color: rgba(164, 70, 78, 0.46);
  }

  .intake-issue-top {
    display: flex;
    justify-content: space-between;
    gap: 14px;
  }

  .intake-issue-title {
    font-size: 15px;
    font-weight: 850;
  }

  .intake-issue-source {
    margin-top: 3px;
    color: rgba(33, 24, 39, 0.58);
    font-size: 12px;
    font-weight: 750;
  }

  .intake-issue-message,
  .intake-issue-workflows {
    margin-top: 5px;
    color: var(--intake-muted);
    font-size: 12px;
    line-height: 1.45;
  }

  .intake-issue-count {
    min-width: 48px;
    text-align: right;
    font-size: 28px;
    font-weight: 850;
  }

  .intake-issue-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  .intake-claim-context {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    padding: 9px 10px;
    border: 1px solid rgba(77, 53, 80, 0.06);
    border-radius: 14px;
    color: rgba(33, 24, 39, 0.72);
    background: rgba(250, 247, 252, 0.70);
    font-size: 12px;
  }

  .intake-claim-context span {
    color: var(--intake-muted);
  }

  .intake-claim-context strong {
    font-weight: 850;
  }

  .intake-inline-button {
    min-height: 32px;
    padding: 6px 10px;
    border-color: rgba(77, 53, 80, 0.10);
    color: rgba(33, 24, 39, 0.72);
    background: rgba(255, 255, 255, 0.68);
    font-size: 12px;
    font-weight: 700;
  }

  .intake-inline-button:hover:not(:disabled) {
    border-color: rgba(157, 105, 153, 0.24);
    background: rgba(255, 255, 255, 0.88);
  }

  .intake-inline-button:disabled {
    color: #98a5b5;
    background: #f2f5f8;
    cursor: not-allowed;
  }

  .intake-issue-details {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(77, 53, 80, 0.08);
  }

  .intake-detail-row {
    padding: 13px 14px;
    border: 1px solid rgba(77, 53, 80, 0.07);
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.62);
  }

  .intake-detail-title {
    font-size: 13px;
    font-weight: 800;
    line-height: 1.25;
  }

  .intake-detail-meta,
  .intake-detail-more,
  .intake-detail-note,
  .intake-detail-subject {
    margin-top: 4px;
    color: var(--intake-muted);
    font-size: 12px;
    line-height: 1.35;
  }

  .intake-detail-subject {
    color: #44546a;
  }

  .intake-detail-note {
    color: #31445c;
  }

  .intake-detail-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 9px;
  }

  .intake-link-details {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .intake-link-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 11px 12px;
    border: 1px solid rgba(77, 53, 80, 0.08);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.68);
  }

  .intake-link-resolved-list {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }

  .intake-link-resolved-pill {
    display: inline-flex;
    align-items: center;
    min-height: 26px;
    padding: 5px 8px;
    border: 1px solid #b8ddc6;
    border-radius: 8px;
    color: var(--intake-green);
    background: var(--intake-green-soft);
    font-size: 12px;
    font-weight: 750;
  }

  .intake-link-form-header,
  .intake-link-form-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .intake-link-form-header {
    justify-content: space-between;
    color: #263446;
    font-size: 12px;
  }

  .intake-link-form-header span {
    color: var(--intake-muted);
    font-weight: 750;
  }

  .intake-link-input {
    flex: 1 1 260px;
    min-width: 180px;
    min-height: 32px;
    padding: 6px 9px;
    border: 1px solid rgba(77, 53, 80, 0.12);
    border-radius: 999px;
    color: #263446;
    background: rgba(255, 255, 255, 0.86);
    font-size: 12px;
  }

  .intake-link-input:focus {
    border-color: #7ea6dc;
    outline: 2px solid rgba(45, 107, 199, 0.16);
    outline-offset: 1px;
  }

  .intake-link-message {
    min-height: 16px;
    color: var(--intake-muted);
    font-size: 12px;
    line-height: 1.35;
  }

  .intake-link-message.is-error {
    color: var(--intake-red);
    font-weight: 750;
  }

  .intake-pending-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .intake-pending-group-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
    padding: 9px 11px;
    border-radius: 16px;
    color: rgba(33, 24, 39, 0.72);
    background: rgba(244, 238, 247, 0.72);
    font-size: 12px;
  }

  .intake-pending-group-header span {
    color: var(--intake-muted);
    font-weight: 850;
  }

  .intake-action-button {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
    min-height: 52px;
    padding: 11px 12px;
    color: rgba(33, 24, 39, 0.72);
    background: rgba(255, 255, 255, 0.62);
    text-align: left;
  }

  .intake-action-button span {
    font-size: 13px;
    font-weight: 800;
  }

  .intake-action-button small {
    color: var(--intake-muted);
    font-size: 11px;
  }

  .intake-action-button:hover:not(:disabled) {
    border-color: #a9bdd8;
    background: #ffffff;
  }

  .intake-action-button:disabled {
    color: #98a5b5;
    cursor: not-allowed;
  }

  .intake-diagnostics {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .intake-diagnostic-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(77, 53, 80, 0.08);
    font-size: 12px;
  }

  .intake-diagnostic-row:last-child {
    border-bottom: 0;
  }

  .intake-diagnostic-row span {
    color: var(--intake-muted);
  }

  .intake-loading,
  .intake-empty-state {
    min-height: 48px;
    padding: 14px;
    border: 1px dashed rgba(72, 54, 75, 0.14);
    border-radius: 18px;
    color: var(--intake-muted);
    background: rgba(255, 255, 255, 0.45);
    font-size: 13px;
    line-height: 1.45;
  }

  .intake-empty-state-healthy {
    border-color: #b8ddc6;
    color: var(--intake-green);
    background: var(--intake-green-soft);
    font-weight: 750;
  }

  @media (max-width: 1180px) {
    .intake-shell {
      grid-template-columns: 1fr;
    }

    .intake-sidebar {
      display: none;
    }

    .intake-kpi-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .intake-content-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 820px) {
    .intake-main {
      padding: 20px 14px 26px;
    }

    .intake-header,
    .intake-health-strip {
      flex-direction: column;
      align-items: stretch;
    }

    .intake-header-actions {
      justify-content: flex-start;
    }

    .intake-health-meta {
      min-width: 0;
    }

    .intake-kpi-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .intake-workflow-row {
      grid-template-columns: 1fr;
    }

    .intake-workflow-metrics {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 520px) {
    .intake-kpi-grid {
      grid-template-columns: 1fr;
    }

    .intake-button {
      width: 100%;
    }
  }
</style>
