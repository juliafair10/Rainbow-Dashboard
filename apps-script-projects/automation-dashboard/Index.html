<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <style>
    :root {
      --bg: #f6f7f9;
      --card-bg: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --success: #15803d;
      --error: #b91c1c;
      --not-run: #6b7280;
      --button: #2563eb;
      --button-hover: #1d4ed8;
      --button-disabled: #93c5fd;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 24px;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 6px 0;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin: 0;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .secondary-button {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 13px;
    }

    .secondary-button:hover {
      background: #f9fafb;
    }

    .section-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 20px 0;
      padding: 8px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.04);
    }

    .section-nav-button {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .section-nav-button:hover {
      background: #f8fafc;
      border-color: var(--border);
      color: var(--text);
    }

    .section-nav-button.primary {
      background: #eff6ff;
      border-color: #bfdbfe;
      color: #1d4ed8;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
    }

    .dashboard-section {
      margin-bottom: 28px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 14px;
      margin: 6px 0 14px 0;
    }

    .section-title {
      font-size: 21px;
      font-weight: 700;
      margin: 0 0 4px 0;
    }

    .section-description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      margin: 0;
    }

    .section-counts {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .section-toggle-button {
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--button);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .section-toggle-button:hover {
      background: #f8fafc;
    }

    .dashboard-section.collapsed .grid {
      display: none;
    }

    .placeholder-card {
      background: #fbfbfc;
      border: 1px dashed #cbd5e1;
      border-radius: 16px;
      padding: 20px;
    }

    .placeholder-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .placeholder-name {
      font-size: 17px;
      font-weight: 700;
      margin: 0 0 6px 0;
    }

    .placeholder-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .placeholder-pill {
      display: inline-block;
      font-size: 11px;
      color: #475569;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      padding: 4px 8px;
    }

    .placeholder-description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      margin: 10px 0 12px 0;
    }

    .placeholder-capabilities {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 12px;
    }

    .placeholder-capabilities-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .placeholder-capabilities-list {
      margin: 0;
      padding-left: 18px;
      color: #374151;
      font-size: 13px;
      line-height: 1.5;
    }

    .coming-soon-button {
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--muted);
      border-radius: 10px;
      padding: 9px 12px;
      font-weight: 700;
      cursor: not-allowed;
      min-width: 110px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.04);
      cursor: pointer;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }

    .automation-name {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 5px 0;
      line-height: 1.25;
    }

    .category {
      display: inline-block;
      font-size: 11px;
      color: #374151;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      border-radius: 999px;
      padding: 3px 8px;
    }

    .capability-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }

    .capability-pill {
      display: inline-block;
      font-size: 10px;
      color: #475569;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      padding: 3px 7px;
    }

    .capability-pill.featured {
      color: #1d4ed8;
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .status {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      border-radius: 999px;
      padding: 5px 9px;
      white-space: nowrap;
    }

    .status-success {
      color: var(--success);
      background: #dcfce7;
    }

    .status-error {
      color: var(--error);
      background: #fee2e2;
    }

    .status-not-run {
      color: var(--not-run);
      background: #f3f4f6;
    }

    .details {
      border-top: 1px solid var(--border);
      margin-top: 10px;
      padding-top: 10px;
    }

    .row {
      margin-bottom: 7px;
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 3px;
    }

    .value {
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }

    .message {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      min-height: 0;
      max-height: 52px;
      overflow: hidden;
      font-size: 12px;
      line-height: 1.35;
    }

    .actions {
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }

    .run-button {
      background: var(--button);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
      min-width: 74px;
      font-size: 12px;
    }

    .run-button:hover {
      background: var(--button-hover);
    }

    .run-button:disabled {
      background: var(--button-disabled);
      cursor: not-allowed;
    }

    .loading {
      font-size: 13px;
      color: var(--muted);
      display: none;
    }

    .notice {
      display: none;
      margin-bottom: 18px;
      border-radius: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      font-size: 14px;
    }

    .notice.error {
      border-color: #fecaca;
      background: #fef2f2;
      color: #991b1b;
    }

    .notice.success {
      border-color: #bbf7d0;
      background: #f0fdf4;
      color: #166534;
    }

    .operations-summary {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .workspace-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(300px, 0.9fr);
      gap: 22px;
      align-items: start;
      margin-bottom: 26px;
    }

    .workspace-main,
    .workspace-sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .focus-workflow-card {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid var(--border);
      border-left: 5px solid #cbd5e1;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }

    .focus-workflow-card.health-success {
      border-left-color: #22c55e;
    }

    .focus-workflow-card.health-error {
      border-left-color: #ef4444;
    }

    .focus-workflow-card.health-not-run {
      border-left-color: #94a3b8;
    }

    .focus-workflow-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 18px;
    }

    .focus-workflow-title {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 8px 0;
    }

    .focus-workflow-subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin: 0;
      max-width: 620px;
    }

    .focus-workflow-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .focus-workflow-context {
      margin-top: 18px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .focus-context-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .focus-context-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .focus-context-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .focus-context-card-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .focus-context-card-text {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .focus-context-button {
      width: 100%;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .focus-context-button:hover {
      background: #dbeafe;
    }

    .focus-workflow-button {
      background: var(--button);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .focus-workflow-button.secondary {
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .focus-workflow-button.secondary:hover {
      background: #f8fafc;
    }

    .focus-workflow-button:hover {
      background: var(--button-hover);
    }

    .focus-workflow-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .focus-metric {
      background: rgba(255,255,255,0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .focus-metric-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .focus-metric-value {
      font-size: 24px;
      font-weight: 700;
    }

    .sidebar-panel {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
    }

    .sidebar-panel-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 12px 0;
    }

    .sidebar-workflow-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-workflow-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #fafafa;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .sidebar-workflow-item:hover {
      background: #ffffff;
      border-color: #bfdbfe;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.08);
    }

    .sidebar-workflow-item.active {
      background: #eff6ff;
      border-color: #93c5fd;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.12);
    }

    .sidebar-workflow-name {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .sidebar-workflow-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .collapsible-toggle {
      margin-top: 16px;
      border: none;
      background: transparent;
      color: var(--button);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }

    .operations-summary.collapsed .operations-summary-content {
      display: none;
    }

    @media (max-width: 960px) {
      .workspace-layout {
        grid-template-columns: 1fr;
      }
    }

    .operations-summary-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .operations-summary-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .operations-summary-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
    }

    .operations-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .metric-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #f9fafb;
    }

    .metric-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 22px;
      font-weight: 700;
    }

    .failed-list {
      margin-top: 16px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    .failed-item {
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 10px;
      background: #fef2f2;
      border: 1px solid #fecaca;
    }

    .failed-item-name {
      font-size: 14px;
      font-weight: 700;
      color: #991b1b;
      margin-bottom: 4px;
    }

    .failed-item-message {
      font-size: 13px;
      color: #7f1d1d;
    }

    .queue-health-details {
      margin-top: 16px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    .queue-health-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .workflow-health-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .workflow-health-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #ffffff;
    }

    .workflow-health-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .workflow-health-name {
      font-size: 14px;
      font-weight: 700;
    }

    .workflow-mini-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .mini-metric {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
    }

    .mini-metric-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 3px;
    }

    .mini-metric-value {
      font-size: 16px;
      font-weight: 700;
    }

    .operations-actions-panel {
      margin-top: 18px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .operations-actions-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .operations-actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .operations-action-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #ffffff;
    }

    .operations-action-name {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .operations-action-description {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .operations-action-button {
      width: 100%;
      background: var(--button);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .operations-action-button:hover {
      background: var(--button-hover);
    }

    .operations-action-result {
      display: none;
      margin-top: 14px;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      border: 1px solid var(--border);
      background: #ffffff;
    }

    .operations-action-result.success {
      display: block;
      border-color: #bbf7d0;
      background: #f0fdf4;
      color: #166534;
    }

    .operations-action-result.error {
      display: block;
      border-color: #fecaca;
      background: #fef2f2;
      color: #991b1b;
    }

    .inspection-results-panel {
      display: none;
      margin-top: 16px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .inspection-results-panel.visible {
      display: block;
    }

    .inspection-results-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .inspection-summary {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
    }

    .inspection-table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #ffffff;
    }

    .inspection-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .inspection-table th,
    .inspection-table td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .inspection-table th {
      color: var(--muted);
      background: #f9fafb;
      font-size: 12px;
      font-weight: 700;
    }

    .inspection-table tr:last-child td {
      border-bottom: none;
    }

    .inspection-row-warning td {
      background: #fffbeb;
    }

    .inspection-row-critical td {
      background: #fef2f2;
    }

    .inspection-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .inspection-parse-errors {
      color: #991b1b;
      font-size: 12px;
      line-height: 1.4;
    }

    .inspection-gmail-link {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 8px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .inspection-gmail-link:hover {
      background: #dbeafe;
    }

    .inspection-row-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 110px;
    }

    .inspection-retry-button {
      border: 1px solid #fed7aa;
      background: #fff7ed;
      color: #9a3412;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .inspection-retry-button:hover {
      background: #ffedd5;
    }

    .inspection-empty {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #ffffff;
      color: var(--muted);
      font-size: 13px;
    }

    .operations-detail-panel {
      margin-top: 18px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .operations-detail-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .operations-detail-empty {
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 14px;
      color: var(--muted);
      font-size: 13px;
      background: #fafafa;
    }

    .operations-subsection {
      margin-top: 18px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .operations-subsection-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .operations-subsection-title {
      font-size: 15px;
      font-weight: 700;
    }

    .operations-subsection-toggle {
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--button);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .operations-subsection-toggle:hover {
      background: #f8fafc;
    }

    .operations-subsection.collapsed .operations-subsection-content {
      display: none;
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="header">
      <div>
        <h1 class="title">Automation Dashboard</h1>
        <p class="subtitle">
          Run automations, monitor status, and review logs.
        </p>
      </div>

      <div class="toolbar">
        <button class="secondary-button" onclick="refreshOperationsDashboard()">
          Refresh
        </button>

        <button class="secondary-button" onclick="openRunLog()">
          Open Run Log
        </button>
      </div>
    </div>

    <div id="notice" class="notice"></div>

    <div class="section-nav" aria-label="Dashboard section navigation">
      <button class="section-nav-button primary" onclick="scrollToDashboardArea('focusWorkflow')">
        Focus
      </button>
      <button class="section-nav-button" onclick="scrollToDashboardArea('operationsSummary')">
        Operations
      </button>
      <button class="section-nav-button" onclick="scrollToDashboardArea('section-automations')">
        Automations
      </button>
      <button class="section-nav-button" onclick="scrollToDashboardArea('section-reports')">
        Reports
      </button>
      <button class="section-nav-button" onclick="scrollToDashboardArea('workflowSidebar')">
        Planned
      </button>
    </div>

    <div class="workspace-layout">

      <div class="workspace-main">
        <div id="focusWorkflow"></div>

        <div id="operationsSummary"></div>

        <div id="dashboardSections"></div>
      </div>

      <div class="workspace-sidebar">
        <div id="workflowSidebar"></div>
      </div>

    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      refreshDashboard();
    });

    const OPERATIONS_ACTIONS = [
      {
        id: 'inspect-asbestos-pending-claim-folders',
        name: 'Inspect Asbestos Pending Folders',
        description: 'Review asbestos claim-folder recovery queue visibility.'
      },
      {
        id: 'inspect-itel-pending-claim-folders',
        name: 'Inspect Itel Pending Folders',
        description: 'Review itel claim-folder recovery queue visibility.'
      },
      {
        id: 'retry-asbestos-intake',
        name: 'Retry Asbestos Workflow',
        description: 'Retry asbestos threads waiting for claim folders.'
      },
      {
        id: 'retry-itel-intake',
        name: 'Retry Itel Workflow',
        description: 'Retry itel threads waiting for claim folders.'
      },
      {
        id: 'setup-retry-triggers',
        name: 'Setup Retry Triggers',
        description: 'Create scheduled recovery triggers for all retry workflows.'
      },
      {
        id: 'delete-retry-triggers',
        name: 'Delete Retry Triggers',
        description: 'Remove all scheduled retry trigger handlers safely.'
      }
    ];

    let lastOperationsActionResult = null;
    let lastInspectionResult = null;
    let noticeTimeoutId = null;
    let operationsActionResultTimeoutId = null;
    let selectedFocusWorkflowId = null;
    let latestDashboardData = null;

    function isOperationsActionId(id) {
      return OPERATIONS_ACTIONS.some(function(action) {
        return action.id === id;
      });
    }

    function refreshOperationsDashboard() {
      showNotice('success', 'Refreshing Operations Center...');

      google.script.run
        .withSuccessHandler(function (result) {
          const message = result && result.message
            ? result.message
            : 'Operations Center refreshed.';

          showNotice('success', message);
          refreshDashboard();
        })
        .withFailureHandler(function (err) {
          showNotice('error', err.message || err || 'Refresh failed.');
        })
        .runAutomation('phase-4f-queue-health');
    }

    function refreshDashboard() {
      google.script.run
        .withSuccessHandler(function(data) {
          try {
            latestDashboardData = data;
            renderDashboardShell(data);
            refreshOperationsSummaryData();
          } catch (error) {
            showNotice('error', 'Dashboard render failed: ' + (error.message || error));
          }
        })
        .withFailureHandler(function(err) {
          showNotice('error', 'Dashboard data failed to load: ' + (err.message || err));
        })
        .getDashboardShellData();
    }

    function renderDashboardShell(data) {
      const visibleAutomations = getVisibleAutomations(data);

      if (!selectedFocusWorkflowId && visibleAutomations.length > 0) {
        selectedFocusWorkflowId = visibleAutomations[0].id;
      }

      renderFocusWorkflow(data, visibleAutomations);
      renderWorkflowSidebar(data, visibleAutomations);

      renderDashboardSections(data);
    }

    function refreshOperationsSummaryData() {
      google.script.run
        .withSuccessHandler(function(summary) {
          if (latestDashboardData) {
            latestDashboardData.operationsSummary = summary;
          }

          renderOperationsSummary(summary);
        })
        .withFailureHandler(function(err) {
          showNotice('error', err.message || err || 'Operations data failed to load.');
        })
        .getOperationsSummaryData();
    }

    function renderFocusWorkflow(data, visibleAutomations) {
      const container = document.getElementById('focusWorkflow');
      const automations = visibleAutomations || getVisibleAutomations(data);
      const primaryWorkflow = automations.find(function(automation) {
        return automation.id === selectedFocusWorkflowId;
      }) || automations[0];

      if (!primaryWorkflow) {
        container.innerHTML = '';
        return;
      }

      const healthClass = getFocusWorkflowHealthClass(getAutomationStatus(primaryWorkflow));
      const focusMetrics = buildFocusWorkflowMetrics(primaryWorkflow, data);

      container.innerHTML = `
        <div class="focus-workflow-card ${healthClass}">
          <div class="focus-workflow-top">
            <div>
              <h2 class="focus-workflow-title">
                ${escapeHtml(primaryWorkflow.name)}
              </h2>

              <p class="focus-workflow-subtitle">
                Focused operational workspace for monitoring queue activity, retries, diagnostics, and workflow execution.
              </p>
            </div>

            ${buildStatusBadge(getAutomationStatus(primaryWorkflow))}
          </div>

          <div class="focus-workflow-metrics">
            ${focusMetrics.map(function(metric) {
              return buildFocusMetric(metric.label, metric.value);
            }).join('')}
          </div>

          <div class="focus-workflow-actions">
            <button
              class="focus-workflow-button"
              onclick="runAutomation('${primaryWorkflow.id}', event)">
              Run Workflow
            </button>

            <button
              class="focus-workflow-button secondary"
              onclick="refreshOperationsDashboard()">
              Refresh Workspace
            </button>
          </div>

          ${buildFocusWorkflowContext(primaryWorkflow)}
        </div>
      `;
    }

    function buildFocusWorkflowMetrics(workflow, data) {
      const queueHealth = getRelatedQueueHealthForWorkflow(workflow, data);
      const lastRun = getAutomationLastRunTime(workflow)
        ? formatDisplayDateTime(getAutomationLastRunTime(workflow))
        : 'Never';

      if (!queueHealth) {
        return [
          {
            label: 'Last Run',
            value: lastRun
          },
          {
            label: 'Workflow Status',
            value: getAutomationStatus(workflow)
          },
          {
            label: 'Category',
            value: workflow.category || 'Workflow'
          }
        ];
      }

      return [
        {
          label: 'Last Run',
          value: lastRun
        },
        {
          label: 'Queue Health',
          value: queueHealth.health || 'Unknown'
        },
        {
          label: 'Pending Folders',
          value: queueHealth.pendingClaimFolderCount || 0
        },
        {
          label: 'Retry Ready',
          value: queueHealth.retryReadyCount || 0
        }
      ];
    }

    function getRelatedQueueHealthForWorkflow(workflow, data) {
      const operationsSummary = data && data.operationsSummary
        ? data.operationsSummary
        : null;
      const queueHealth = operationsSummary && operationsSummary.queueHealth
        ? operationsSummary.queueHealth
        : null;
      const workflows = queueHealth && queueHealth.workflows
        ? queueHealth.workflows
        : null;

      if (!workflows) {
        return null;
      }

      const workflowText = [
        workflow.id,
        workflow.name,
        workflow.category,
        workflow.action
      ].join(' ').toLowerCase();

      if (workflowText.indexOf('asbestos') !== -1) {
        return findQueueHealthWorkflow(workflows, 'asbestos');
      }

      if (workflowText.indexOf('itel') !== -1) {
        return findQueueHealthWorkflow(workflows, 'itel');
      }

      if (workflowText.indexOf('insurance') !== -1) {
        return findQueueHealthWorkflow(workflows, 'insurance');
      }

      return null;
    }

    function findQueueHealthWorkflow(workflows, keyword) {
      const workflowKeys = Object.keys(workflows || {});

      for (let index = 0; index < workflowKeys.length; index++) {
        const key = workflowKeys[index];
        const workflow = workflows[key] || {};
        const workflowText = [
          key,
          workflow.name,
          workflow.workflow,
          workflow.id
        ].join(' ').toLowerCase();

        if (workflowText.indexOf(keyword) !== -1) {
          return workflow;
        }
      }

      return null;
    }

    function buildFocusWorkflowContext(workflow) {
      const relatedActions = getRelatedOperationsActions(workflow);

      if (relatedActions.length === 0) {
        return '';
      }

      return `
        <div class="focus-workflow-context">
          <div class="focus-context-title">Related operational tools</div>
          <div class="focus-context-grid">
            ${relatedActions.map(function(action) {
              return `
                <div class="focus-context-card">
                  <div class="focus-context-card-title">${escapeHtml(action.name)}</div>
                  <div class="focus-context-card-text">${escapeHtml(action.description)}</div>
                  <button
                    class="focus-context-button"
                    onclick="runAutomation('${action.id}', event)">
                    Run Tool
                  </button>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function getRelatedOperationsActions(workflow) {
      const workflowText = [
        workflow.id,
        workflow.name,
        workflow.category,
        workflow.action
      ].join(' ').toLowerCase();

      if (workflowText.indexOf('asbestos') !== -1) {
        return OPERATIONS_ACTIONS.filter(function(action) {
          return action.id.indexOf('asbestos') !== -1;
        });
      }

      if (workflowText.indexOf('itel') !== -1) {
        return OPERATIONS_ACTIONS.filter(function(action) {
          return action.id.indexOf('itel') !== -1;
        });
      }

      if (workflowText.indexOf('insurance') !== -1) {
        return OPERATIONS_ACTIONS.filter(function(action) {
          return action.id.indexOf('insurance') !== -1;
        });
      }

      return [];
    }

    function renderWorkflowSidebar(data, visibleAutomations) {
      const container = document.getElementById('workflowSidebar');
      const automations = visibleAutomations || getVisibleAutomations(data);
      const placeholders = data.placeholderWorkflows || [];

      container.innerHTML = `
        <div class="sidebar-panel">
          <h3 class="sidebar-panel-title">Workflow Overview</h3>

          <div class="sidebar-workflow-list">
            ${automations.map(function(automation) {
              return `
                <div
                  class="sidebar-workflow-item ${automation.id === selectedFocusWorkflowId ? 'active' : ''}"
                  onclick="selectFocusWorkflow('${automation.id}')">
                  <div class="sidebar-workflow-name">
                    ${escapeHtml(automation.name)}
                  </div>

                  <div class="sidebar-workflow-meta">
                    ${escapeHtml(automation.category || 'Automation')}<br>
                    Status: ${escapeHtml(getAutomationStatus(automation))}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <div class="sidebar-panel">
          <h3 class="sidebar-panel-title">Planned Workflows</h3>

          <div class="sidebar-workflow-list">
            ${placeholders.map(function(workflow) {
              return `
                <div class="sidebar-workflow-item">
                  <div class="sidebar-workflow-name">
                    ${escapeHtml(workflow.name)}
                  </div>

                  <div class="sidebar-workflow-meta">
                    ${escapeHtml(workflow.frequency || 'Future')}<br>
                    ${escapeHtml(workflow.status || 'Planned')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function getVisibleAutomations(data) {
      return (data.automations || [])
        .filter(shouldRenderAutomationCard)
        .sort(function(a, b) {
          if (Boolean(a.featured) !== Boolean(b.featured)) {
            return a.featured ? -1 : 1;
          }

          return (a.order || 100) - (b.order || 100);
        });
    }

    function buildCapabilityPills(automation) {
      const capabilities = automation.capabilities || {};
      const pills = [];

      if (automation.featured) {
        pills.push('<span class="capability-pill featured">Featured</span>');
      }

      if (capabilities.retry) {
        pills.push('<span class="capability-pill">Retry</span>');
      }

      if (capabilities.inspect) {
        pills.push('<span class="capability-pill">Inspect</span>');
      }

      if (capabilities.queueHealth) {
        pills.push('<span class="capability-pill">Queue Health</span>');
      }

      if (capabilities.report) {
        pills.push('<span class="capability-pill">Report</span>');
      }

      if (pills.length === 0) {
        return '';
      }

      return `
        <div class="capability-row">
          ${pills.join('')}
        </div>
      `;
    }

    function selectFocusWorkflow(id) {
      selectedFocusWorkflowId = id;

      if (latestDashboardData) {
        const visibleAutomations = getVisibleAutomations(latestDashboardData);
        renderFocusWorkflow(latestDashboardData, visibleAutomations);
        renderWorkflowSidebar(latestDashboardData, visibleAutomations);
        return;
      }

      refreshDashboard();
    }

    function scrollToDashboardArea(id) {
      const element = document.getElementById(id);

      if (!element) {
        return;
      }

      element.scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });
    }

    function buildStatusBadge(status) {
      return `
        <div class="${getStatusClass(status)}">
          ${escapeHtml(status || 'Unknown')}
        </div>
      `;
    }

    function getFocusWorkflowHealthClass(status) {
      if (status === 'Success') {
        return 'health-success';
      }

      if (status === 'Error') {
        return 'health-error';
      }

      return 'health-not-run';
    }

    function buildQueueHealthBadge(health) {
      return `
        <div class="${getQueueHealthStatusClass(health)}">
          ${escapeHtml(health || 'Unknown')}
        </div>
      `;
    }

    function buildMetricCard(label, value) {
      return `
        <div class="metric-card">
          <span class="metric-label">${escapeHtml(label)}</span>
          <div class="metric-value">${escapeHtml(value)}</div>
        </div>
      `;
    }

    function buildFocusMetric(label, value) {
      return `
        <div class="focus-metric">
          <span class="focus-metric-label">${escapeHtml(label)}</span>
          <div class="focus-metric-value">${escapeHtml(value)}</div>
        </div>
      `;
    }

    function getAutomationResponse(automation) {
      return automation.normalizedResponse || {
        status: automation.lastStatus || 'Unknown',
        message: automation.lastMessage || 'No runs yet',
        lastRunTime: automation.lastRunTime || '',
        responseType: 'unknown',
        metrics: {}
      };
    }

    function getAutomationStatus(automation) {
      return getAutomationResponse(automation).status || automation.lastStatus || 'Unknown';
    }

    function getAutomationMessage(automation) {
      return getAutomationResponse(automation).message || automation.lastMessage || 'No runs yet';
    }

    function getAutomationLastRunTime(automation) {
      return getAutomationResponse(automation).lastRunTime || automation.lastRunTime || '';
    }

    function getAutomationResponseType(automation) {
      return getAutomationResponse(automation).responseType || 'unknown';
    }

    function renderDashboardSections(data) {
      const container = document.getElementById('dashboardSections');
      const sections = data.sections || buildFallbackDashboardSections(data);

      container.innerHTML = sections.map(function(section) {
        return buildDashboardSectionHtml(section);
      }).join('');
    }


    function buildFallbackDashboardSections(data) {
      const automations = data.automations || [];
      const placeholderWorkflows = data.placeholderWorkflows || [];

      return [
        {
          id: 'automations',
          name: 'Automations',
          description: 'Active workflow automations that process Gmail, Drive, Calendar, and job data.',
          activeAutomations: automations,
          placeholderWorkflows: []
        },
        {
          id: 'reports',
          name: 'Reports',
          description: 'Reporting workflows and future report automation placeholders.',
          activeAutomations: [],
          placeholderWorkflows: placeholderWorkflows.filter(function(workflow) {
            return workflow.section === 'reports';
          })
        },
        {
          id: 'operations',
          name: 'Operations',
          description: 'Daily operational controls, queue health, recovery, and inspection tools.',
          activeAutomations: [],
          placeholderWorkflows: placeholderWorkflows.filter(function(workflow) {
            return workflow.section === 'operations';
          })
        }
      ];
    }

    function buildDashboardSectionHtml(section) {
      const activeAutomations = (section.activeAutomations || []).filter(shouldRenderAutomationCard);
      const placeholderWorkflows = section.placeholderWorkflows || [];
      const cardsHtml = activeAutomations.map(buildAutomationCardHtml)
        .concat(placeholderWorkflows.map(buildPlaceholderWorkflowCardHtml))
        .join('');

      if (!cardsHtml) {
        return '';
      }

      const shouldCollapse = shouldCollapseDashboardSection(section.id);
      const isCollapsed = getStoredDashboardSectionCollapsedState(section.id, shouldCollapse);
      const sectionClass = isCollapsed
        ? 'dashboard-section collapsed'
        : 'dashboard-section';
      const toggleHtml = shouldCollapse
        ? `<button class="section-toggle-button" onclick="toggleDashboardSection('${section.id}', this)">${isCollapsed ? 'Show' : 'Hide'}</button>`
        : '';

      return `
        <section class="${sectionClass}" id="section-${section.id}">
          <div class="section-header">
            <div>
              <h2 class="section-title">${escapeHtml(section.name)}</h2>
              <p class="section-description">${escapeHtml(section.description || '')}</p>
            </div>
            <div class="section-counts">
              ${activeAutomations.length} active • ${placeholderWorkflows.length} planned
              ${toggleHtml}
            </div>
          </div>

          <div class="grid">
            ${cardsHtml}
          </div>
        </section>
      `;
    }

    function shouldCollapseDashboardSection(sectionId) {
      return sectionId === 'automations' ||
        sectionId === 'operations' ||
        sectionId === 'reports';
    }

    function getStoredDashboardSectionCollapsedState(sectionId, defaultValue) {
      try {
        const storedValue = localStorage.getItem('rainbowDashboard.section.' + sectionId + '.collapsed');

        if (storedValue === null) {
          return defaultValue;
        }

        return storedValue === 'true';
      } catch (error) {
        return defaultValue;
      }
    }

    function setStoredDashboardSectionCollapsedState(sectionId, isCollapsed) {
      try {
        localStorage.setItem('rainbowDashboard.section.' + sectionId + '.collapsed', String(isCollapsed));
      } catch (error) {
        // Ignore storage failures so the dashboard can still render.
      }
    }

    function toggleDashboardSection(sectionId, button) {
      const section = document.getElementById('section-' + sectionId);

      if (!section) {
        return;
      }

      const isCollapsed = section.classList.contains('collapsed');

      if (isCollapsed) {
        section.classList.remove('collapsed');
        button.textContent = 'Hide';
        setStoredDashboardSectionCollapsedState(sectionId, false);
      } else {
        section.classList.add('collapsed');
        button.textContent = 'Show';
        setStoredDashboardSectionCollapsedState(sectionId, true);
      }
    }

    function buildAutomationCardHtml(automation) {
      return `
        <div class="card" onclick="selectFocusWorkflow('${automation.id}')">
          <div class="card-top">
            <div>
              <div class="automation-name">${escapeHtml(automation.name)}</div>
              <div class="category">${escapeHtml(automation.category)}</div>
              ${buildCapabilityPills(automation)}
            </div>

            ${buildStatusBadge(getAutomationStatus(automation))}
          </div>

          <div class="details">

            <div class="row">
              <span class="label">Last Run</span>
              <div class="value">
                ${escapeHtml(getAutomationLastRunTime(automation) || 'Never')}
              </div>
            </div>

            <div class="row">
              <span class="label">Latest Result</span>
              <div class="message">
                ${escapeHtml(getAutomationMessage(automation))}
              </div>
            </div>

          </div>

          <div class="actions">
            <span id="loading-${automation.id}" class="loading">
              Running...
            </span>

            <button
              id="button-${automation.id}"
              class="run-button"
              onclick="runAutomation('${automation.id}', event)">
              Run
            </button>
          </div>
        </div>
      `;
    }

    function buildPlaceholderWorkflowCardHtml(workflow) {
      const capabilities = workflow.plannedCapabilities || [];

      return `
        <div class="placeholder-card">
          <div class="placeholder-top">
            <div>
              <div class="placeholder-name">${escapeHtml(workflow.name)}</div>
              <div class="category">${escapeHtml(workflow.category || 'Planned Workflow')}</div>
              <div class="placeholder-meta">
                <span class="placeholder-pill">${escapeHtml(workflow.status || 'Planned')}</span>
                <span class="placeholder-pill">${escapeHtml(workflow.frequency || 'Future')}</span>
              </div>
            </div>
          </div>

          <div class="placeholder-description">
            ${escapeHtml(workflow.description || '')}
          </div>

          <div class="placeholder-capabilities">
            <div class="placeholder-capabilities-title">Planned capabilities</div>
            <ul class="placeholder-capabilities-list">
              ${capabilities.map(function(capability) {
                return `<li>${escapeHtml(capability)}</li>`;
              }).join('')}
            </ul>
          </div>

          <div class="actions">
            <button class="coming-soon-button" disabled>
              Coming Soon
            </button>
          </div>
        </div>
      `;
    }

    function shouldRenderAutomationCard(automation) {
      const monitoringOnlyIds = [
        'phase-4f-queue-health',
        'insurance-intake-queue-health',
        'asbestos-queue-health',
        'itel-queue-health'
      ];
      const operationsActionIds = OPERATIONS_ACTIONS.map(function(action) {
        return action.id;
      });
      const hiddenOperationalIds = monitoringOnlyIds.concat(operationsActionIds);

      return hiddenOperationalIds.indexOf(automation.id) === -1;
    }

    function renderOperationsSummary(summary) {
      const container = document.getElementById('operationsSummary');

      if (!summary) {
        container.innerHTML = '';
        return;
      }

      const failedItemsHtml = summary.failedAutomations.length > 0
        ? `
          <div class="failed-list">
            ${summary.failedAutomations.map(function(item) {
              return `
                <div class="failed-item">
                  <div class="failed-item-name">${item.name}</div>
                  <div class="failed-item-message">
                    ${item.lastMessage || 'Unknown error'}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `
        : '';

      const queueHealthHtml = summary.queueHealth
        ? buildQueueHealthHtml(summary.queueHealth)
        : '';
      const operationsSummaryCollapsed = getStoredOperationsSummaryCollapsedState(true);

      container.innerHTML = `
        <div class="operations-summary ${operationsSummaryCollapsed ? 'collapsed' : ''}">
          <div class="operations-summary-top">
            <div>
              <h2 class="operations-summary-title">
                Operations Center
              </h2>

              <div class="subtitle">
                Latest activity:
                ${summary.latestRunTime ? formatDisplayDateTime(summary.latestRunTime) : 'No operations runs yet'}
              </div>
            </div>

            <div class="operations-summary-controls">
              ${buildStatusBadge(summary.overallStatus)}
              <button
                class="section-toggle-button"
                onclick="toggleOperationsSummary(this)">
                ${operationsSummaryCollapsed ? 'Show' : 'Hide'}
              </button>
            </div>
          </div>

          <div class="operations-summary-content">
            <div class="operations-metrics">
              ${buildMetricCard('Watched Operations', summary.watchedCount)}
              ${buildMetricCard('Successful', summary.successCount)}
              ${buildMetricCard('Errors', summary.errorCount)}
              ${buildMetricCard('Not Run', summary.notRunCount)}
            </div>

            ${queueHealthHtml}

            ${buildOperationsActionsHtml()}

            ${failedItemsHtml}
          </div>
        </div>
      `;

      if (lastOperationsActionResult && lastOperationsActionResult.expiresAt > Date.now()) {
        showOperationsActionResult(
          lastOperationsActionResult.type,
          lastOperationsActionResult.message
        );
      } else {
        lastOperationsActionResult = null;
      }

      if (lastInspectionResult) {
        renderInspectionResults(
          lastInspectionResult.actionId,
          lastInspectionResult.result,
          true
        );
      }
    }

    function buildOperationsActionsHtml() {
      const actions = OPERATIONS_ACTIONS;

      return `
        <div class="operations-subsection collapsed">
          <div class="operations-subsection-header">
            <div class="operations-subsection-title">
              Recovery Tools
            </div>

            <button
              class="operations-subsection-toggle"
              onclick="toggleOperationsSubsection(this)">
              Show
            </button>
          </div>

          <div class="operations-subsection-content">
            <div id="operationsActionResult" class="operations-action-result"></div>

            <div class="operations-subsection collapsed">
              <div class="operations-subsection-header">
                <div class="operations-subsection-title">
                  Operational Details
                </div>

                <button
                  class="operations-subsection-toggle"
                  onclick="toggleOperationsSubsection(this)">
                  Show
                </button>
              </div>

              <div class="operations-subsection-content">
                <div id="inspectionResultsPanel" class="inspection-results-panel visible">
                  <div class="operations-detail-empty">
                    No operational inspection details loaded yet.
                  </div>
                </div>
              </div>
            </div>

            <div class="operations-actions-grid">
              ${actions.map(function(action) {
                return `
                  <div class="operations-action-card">
                    <div class="operations-action-name">
                      ${escapeHtml(action.name)}
                    </div>

                    <div class="operations-action-description">
                      ${escapeHtml(action.description)}
                    </div>

                    <div class="actions">
                      <span id="loading-${action.id}" class="loading">
                        Running...
                      </span>

                      <button
                        id="button-${action.id}"
                        class="operations-action-button"
                        onclick="runAutomation('${action.id}', event)">
                        Run Action
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function buildQueueHealthHtml(queueHealth) {
      const totals = queueHealth.totals || {};
      const workflows = queueHealth.workflows || {};

      const workflowCardsHtml = Object.keys(workflows).map(function(workflowKey) {
        const workflow = workflows[workflowKey];

        return `
          <div class="workflow-health-card">
            <div class="workflow-health-top">
              <div class="workflow-health-name">${workflow.name}</div>
              ${buildQueueHealthBadge(workflow.health)}
            </div>

            <div class="workflow-mini-metrics">
              <div class="mini-metric">
                <span class="mini-metric-label">Pending Folders</span>
                <div class="mini-metric-value">${workflow.pendingClaimFolderCount || 0}</div>
              </div>

              <div class="mini-metric">
                <span class="mini-metric-label">Retry Ready</span>
                <div class="mini-metric-value">${workflow.retryReadyCount || 0}</div>
              </div>

              <div class="mini-metric">
                <span class="mini-metric-label">Retry Limit</span>
                <div class="mini-metric-value">${workflow.retryLimitReachedCount || 0}</div>
              </div>

              <div class="mini-metric">
                <span class="mini-metric-label">Errors</span>
                <div class="mini-metric-value">${workflow.errorCount || 0}</div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="operations-subsection">
          <div class="operations-subsection-header">
            <div class="operations-subsection-title">
              Queue Health Snapshot
            </div>

            <button
              class="operations-subsection-toggle"
              onclick="toggleOperationsSubsection(this)">
              Hide
            </button>
          </div>

          <div class="operations-subsection-content">
            <div class="subtitle">
              Overall queue health: ${queueHealth.overallHealth || 'Unknown'}
              ${queueHealth.checkedAt ? `• Checked: ${formatDisplayDateTime(queueHealth.checkedAt)}` : ''}
            </div>

            <div class="operations-metrics">
              <div class="metric-card">
                <span class="metric-label">Pending Claim Folders</span>
                <div class="metric-value">${totals.pendingClaimFolderCount || 0}</div>
              </div>

              <div class="metric-card">
                <span class="metric-label">Retry Ready</span>
                <div class="metric-value">${totals.retryReadyCount || 0}</div>
              </div>

              <div class="metric-card">
                <span class="metric-label">Retry Limit Reached</span>
                <div class="metric-value">${totals.retryLimitReachedCount || 0}</div>
              </div>

              <div class="metric-card">
                <span class="metric-label">Errors / Reviews</span>
                <div class="metric-value">${(totals.errorCount || 0) + (totals.reviewCount || 0)}</div>
              </div>
            </div>

            <div class="workflow-health-grid">
              ${workflowCardsHtml}
            </div>
          </div>
        </div>
      `;
    }

    function toggleOperationsSubsection(button) {
      const section = button.closest('.operations-subsection');

      if (!section) {
        return;
      }

      const collapsed = section.classList.contains('collapsed');

      if (collapsed) {
        section.classList.remove('collapsed');
        button.textContent = 'Hide';
      } else {
        section.classList.add('collapsed');
        button.textContent = 'Show';
      }
    }

    function getStoredOperationsSummaryCollapsedState(defaultValue) {
      const storageKey = 'rainbowDashboard.operationsSummary.collapsed';

      try {
        const storedValue = localStorage.getItem(storageKey);

        if (storedValue !== null) {
          return storedValue === 'true';
        }
      } catch (error) {
        // Continue to window.name fallback below.
      }

      try {
        const windowState = parseJsonSafe(window.name || '{}') || {};

        if (Object.prototype.hasOwnProperty.call(windowState, storageKey)) {
          return windowState[storageKey] === true;
        }
      } catch (error) {
        // Continue to default below.
      }

      return defaultValue;
    }

    function setStoredOperationsSummaryCollapsedState(isCollapsed) {
      const storageKey = 'rainbowDashboard.operationsSummary.collapsed';

      try {
        localStorage.setItem(storageKey, String(isCollapsed));
      } catch (error) {
        // Continue to window.name fallback below.
      }

      try {
        const windowState = parseJsonSafe(window.name || '{}') || {};
        windowState[storageKey] = Boolean(isCollapsed);
        window.name = JSON.stringify(windowState);
      } catch (error) {
        // Ignore storage failures so the dashboard can still render.
      }
    }

    function toggleOperationsSummary(button) {
      const panel = button.closest('.operations-summary');

      if (!panel) {
        return;
      }

      const collapsed = panel.classList.contains('collapsed');

      if (collapsed) {
        panel.classList.remove('collapsed');
        button.textContent = 'Hide';
        setStoredOperationsSummaryCollapsedState(false);
      } else {
        panel.classList.add('collapsed');
        button.textContent = 'Show';
        setStoredOperationsSummaryCollapsedState(true);
      }
    }

    function formatDisplayDateTime(value) {
      if (!value) {
        return '';
      }

      const textValue = String(value);
      const normalizedValue = textValue.indexOf('T') === -1
        ? textValue.replace(' ', 'T')
        : textValue;
      const date = new Date(normalizedValue);

      if (isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleString('en-US', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });
    }

    function getQueueHealthStatusClass(health) {
      if (health === 'Healthy') {
        return 'status status-success';
      }

      if (health === 'Critical') {
        return 'status status-error';
      }

      return 'status status-not-run';
    }

    function runAutomation(id, event) {
      if (event) {
        event.stopPropagation();
      }

      const button = document.getElementById('button-' + id);
      const loading = document.getElementById('loading-' + id);

      if (button) {
        button.disabled = true;
      }

      if (loading) {
        loading.style.display = 'inline';
      }

      google.script.run
        .withSuccessHandler(function (result) {
          const message = result && result.message
            ? result.message
            : 'Action completed successfully.';

          if (isOperationsActionId(id)) {
            const isInspectionAction = isInspectionActionId(id);

            if (!isInspectionAction) {
              lastOperationsActionResult = {
                type: 'success',
                message: message,
                expiresAt: Date.now() + 12000
              };
            }

            renderInspectionResults(id, result, false);
          } else {
            showNotice('success', message);
          }

          refreshDashboard();

          if (button) {
            button.disabled = false;
          }

          if (loading) {
            loading.style.display = 'none';
          }
        })
        .withFailureHandler(function (err) {
          const errorMessage = err.message || err || 'Action failed.';
          if (isOperationsActionId(id)) {
            lastOperationsActionResult = {
              type: 'error',
              message: errorMessage,
              expiresAt: Date.now() + 12000
            };
            showOperationsActionResult('error', errorMessage);
          } else {
            showNotice('error', errorMessage);
          }

          if (button) {
            button.disabled = false;
          }

          if (loading) {
            loading.style.display = 'none';
          }
        })
        .runAutomation(id);
    }

    function renderInspectionResults(actionId, result, fromRefresh) {
      const panel = document.getElementById('inspectionResultsPanel');

      if (!panel) {
        return;
      }

      if (!isInspectionActionId(actionId)) {
        panel.className = 'inspection-results-panel visible';
        panel.innerHTML = `
          <div class="operations-detail-empty">
            No operational inspection details loaded yet.
          </div>
        `;
        lastInspectionResult = null;
        return;
      }


      if (!fromRefresh) {
        lastInspectionResult = {
          actionId: actionId,
          result: result
        };
      }

      const payload = result && result.rawResponse
        ? parseJsonSafe(result.rawResponse)
        : null;
      const items = payload && payload.result && payload.result.items
        ? payload.result.items
        : [];
      const summary = payload && payload.result && payload.result.summary
        ? payload.result.summary
        : {};

      panel.className = 'inspection-results-panel visible';
      panel.innerHTML = buildInspectionResultsHtml(actionId, items, summary);
    }

    function isInspectionActionId(actionId) {
      return actionId === 'inspect-asbestos-pending-claim-folders' ||
        actionId === 'inspect-itel-pending-claim-folders';
    }

    function parseJsonSafe(value) {
      try {
        return JSON.parse(value);
      } catch (error) {
        return null;
      }
    }

    function buildInspectionResultsHtml(actionId, items, summary) {
      const title = actionId === 'inspect-asbestos-pending-claim-folders'
        ? 'Asbestos Pending Folder Inspection'
        : 'Itel Pending Folder Inspection';
      const foundCount = summary.foundCount || items.length || 0;

      if (!items || items.length === 0) {
        return `
          <div class="inspection-results-title">${title}</div>
          <div class="operations-detail-empty">
            No pending claim folder items were returned. Found count: ${foundCount}.
          </div>
        `;
      }

      return `
        <div class="inspection-results-title">${title}</div>
        <div class="inspection-summary">
          Found ${foundCount} pending item(s). Showing ${items.length} item(s).
        </div>
        <div class="inspection-table-wrapper">
          <table class="inspection-table">
            <thead>
              <tr>
                <th>Workflow</th>
                <th>Claim / Customer</th>
                <th>Sender / Messages</th>
                <th>Subject</th>
                <th>Parse Issues</th>
                <th>Recommended Next Step</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${items.map(function(item) {
                return `
                  <tr class="${getInspectionRowClass(item)}">
                    <td>${escapeHtml(item.workflow || '')}</td>
                    <td>
                      <div>${escapeHtml(item.claimNumber || 'Missing claim number')}</div>
                      <div class="inspection-meta">${escapeHtml(item.customerName || 'Unknown customer')}</div>
                    </td>
                    <td>
                      <div>${escapeHtml(item.sender || 'Unknown sender')}</div>
                      <div class="inspection-meta">Messages: ${escapeHtml(item.messageCount || 0)}</div>
                    </td>
                    <td>${escapeHtml(item.subject || '')}</td>
                    <td>${formatParseErrors(item.parseErrors)}</td>
                    <td>${escapeHtml(item.recommendedNextStep || '')}</td>
                    <td>${buildInspectionRowActions(actionId, item)}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }
    function buildInspectionRowActions(actionId, item) {
      const retryActionId = getRetryActionIdForInspectionAction(actionId);

      return `
        <div class="inspection-row-actions">
          ${buildGmailLink(item)}
          ${retryActionId ? `
            <button
              type="button"
              class="inspection-retry-button"
              onclick="runAutomation('${retryActionId}', event)">
              Retry Workflow
            </button>
          ` : ''}
        </div>
      `;
    }

    function getRetryActionIdForInspectionAction(actionId) {
      if (actionId === 'inspect-asbestos-pending-claim-folders') {
        return 'retry-asbestos-intake';
      }

      if (actionId === 'inspect-itel-pending-claim-folders') {
        return 'retry-itel-intake';
      }

      return '';
    }



    function buildGmailLink(item) {
      const threadId = item && item.threadId
        ? String(item.threadId).trim()
        : '';

      if (!threadId) {
        return '<span class="inspection-meta">Unavailable</span>';
      }

      const gmailUrl = 'https://mail.google.com/mail/u/0/#all/' + encodeURIComponent(threadId);

      return `
        <a
          class="inspection-gmail-link"
          href="${gmailUrl}"
          target="_blank"
          rel="noopener noreferrer">
          Open Gmail
        </a>
      `;
    }

    function getInspectionRowClass(item) {
      const parseErrors = item && item.parseErrors ? item.parseErrors : [];
      const hasParseErrors = Array.isArray(parseErrors)
        ? parseErrors.length > 0
        : String(parseErrors || '').trim() !== '';
      const missingClaim = !item || !item.claimNumber;

      if (hasParseErrors || missingClaim) {
        return 'inspection-row-critical';
      }

      return 'inspection-row-warning';
    }

    function formatParseErrors(parseErrors) {
      if (!parseErrors) {
        return '<span class="inspection-meta">None reported</span>';
      }

      if (Array.isArray(parseErrors)) {
        if (parseErrors.length === 0) {
          return '<span class="inspection-meta">None reported</span>';
        }

        return '<div class="inspection-parse-errors">' +
          parseErrors.map(function(error) {
            return escapeHtml(error);
          }).join('<br>') +
          '</div>';
      }

      const text = String(parseErrors || '').trim();

      if (!text) {
        return '<span class="inspection-meta">None reported</span>';
      }

      return '<div class="inspection-parse-errors">' + escapeHtml(text) + '</div>';
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showOperationsActionResult(type, message) {
      const result = document.getElementById('operationsActionResult');

      if (!result) {
        return;
      }

      result.className = 'operations-action-result ' + type;
      result.textContent = message;

      if (operationsActionResultTimeoutId) {
        clearTimeout(operationsActionResultTimeoutId);
      }

      operationsActionResultTimeoutId = setTimeout(function() {
        result.className = 'operations-action-result';
        result.textContent = '';
        lastOperationsActionResult = null;
      }, 12000);
    }

    function showNotice(type, message) {
      const notice = document.getElementById('notice');

      notice.className = 'notice ' + type;
      notice.textContent = message;
      notice.style.display = 'block';

      if (noticeTimeoutId) {
        clearTimeout(noticeTimeoutId);
      }

      noticeTimeoutId = setTimeout(function() {
        notice.style.display = 'none';
        notice.textContent = '';
        notice.className = 'notice';
      }, 10000);
    }

    function openRunLog() {
      google.script.run
        .withSuccessHandler(function (url) {
          window.open(url, '_blank');
        })
        .getRunLogUrl();
    }

    function getStatusClass(status) {
      if (status === 'Success') {
        return 'status status-success';
      }

      if (status === 'Error') {
        return 'status status-error';
      }

      return 'status status-not-run';
    }
  </script>
</body>
</html>
