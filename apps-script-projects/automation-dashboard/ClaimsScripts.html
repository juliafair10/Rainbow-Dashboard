<script>
  const claimsWorkspaceCache = {};
  let activeClaimsWorkspacePayload = null;
  let activeClaimsRouteContext = {};
  let selectedClaimId = '';

  document.addEventListener('DOMContentLoaded', function() {
    initializeClaimsWorkspace();
  });

  window.addEventListener('popstate', function(event) {
    const state = event.state || {};
    const routeContext = state.routeContext || readClaimsRouteContextFromLocation_();

    updateClaimsRouteContext_(routeContext);
    markActiveLens_(routeContext.lensId || 'all');
    loadClaimsWorkspace(routeContext);
  });

  function initializeClaimsWorkspace() {
    const routeContextElement = document.getElementById('claimsRouteContext');
    const params = new URLSearchParams(window.location.search);
    const serverRouteContext = window.RAINBOW_INITIAL_ROUTE_CONTEXT || {};

    const routeContext = {
      lensId: serverRouteContext.lensId || params.get('lensId') || 'all',
      ownership: serverRouteContext.ownership || params.get('ownership') || '',
      condition: serverRouteContext.condition || params.get('condition') || '',
      claimId: serverRouteContext.claimId || params.get('claimId') || '',
      compliance: serverRouteContext.compliance || params.get('compliance') || ''
    };

    updateClaimsRouteContext_(routeContext);
    markActiveLens_(routeContext.lensId);

    initializeLensButtons();
    initializeClaimsSearch();
    initializeClaimsSidebarNavigation_();

    loadClaimsWorkspace(routeContext);

    window.history.replaceState({ routeContext: routeContext }, '', buildClaimsRouteUrl_(routeContext));
  }

  function initializeClaimsSidebarNavigation_() {
    document.querySelectorAll('[data-claims-route]').forEach(function(button) {
      button.addEventListener('click', function(event) {
        event.preventDefault();
        event.stopPropagation();

        navigateClaimsRoute_(button.getAttribute('data-claims-route') || '?view=claimShell');
      });
    });
  }

  function navigateClaimsRoute_(route) {
    const normalizedRoute = route && route.charAt(0) === '?' ? route : '?' + String(route || '').replace(/^\?/, '');
    const dashboardBaseUrl = 'https://script.google.com/a/macros/rbwatl.com/s/AKfycbzX9Mvyr2zk1GkBR2Nfdv9PE994onOVpxQpJj9lq3j87n2NN_iZ3eRWDFWlbfmrvpNoFw/exec';
    const targetUrl = dashboardBaseUrl + normalizedRoute;

    try {
      window.top.location.href = targetUrl;
    } catch (error) {
      window.location.href = targetUrl;
    }
  }

  function readClaimsRouteContextFromLocation_() {
    const params = new URLSearchParams(window.location.search);
    const serverRouteContext = window.RAINBOW_INITIAL_ROUTE_CONTEXT || {};

    return {
      lensId: params.get('lensId') || serverRouteContext.lensId || 'all',
      ownership: params.get('ownership') || serverRouteContext.ownership || '',
      condition: params.get('condition') || serverRouteContext.condition || '',
      claimId: params.get('claimId') || serverRouteContext.claimId || '',
      compliance: params.get('compliance') || serverRouteContext.compliance || ''
    };
  }

  function buildClaimsRouteUrl_(routeContext) {
    const params = new URLSearchParams();

    if (routeContext && routeContext.claimId) {
      params.set('view', 'claimShell');
      params.set('claimId', routeContext.claimId);
    } else {
      params.set('view', 'claimShell');
      params.set('lensId', (routeContext && routeContext.lensId) || 'all');

      if (routeContext && routeContext.ownership) {
        params.set('ownership', routeContext.ownership);
      }

      if (routeContext && routeContext.condition) {
        params.set('condition', routeContext.condition);
      }

      if (routeContext && routeContext.compliance) {
        params.set('compliance', routeContext.compliance);
      }
    }

    return window.location.pathname + '?' + params.toString();
  }

  function initializeLensButtons() {
    document.querySelectorAll('[data-lens]').forEach(function(button) {
      button.addEventListener('click', function(event) {
        event.preventDefault();
        event.stopPropagation();

        const lensId = button.getAttribute('data-lens') || 'all';

        const routeContext = {
          lensId: lensId,
          ownership: '',
          condition: '',
          claimId: '',
          compliance: ''
        };

        selectedClaimId = '';
        markActiveLens_(lensId);
        updateClaimsRouteContext_(routeContext);
        window.history.pushState({ routeContext: routeContext }, '', buildClaimsRouteUrl_(routeContext));

        const stream = document.getElementById('claimsStream');
        const panel = document.getElementById('claimDetailPanel');
        const searchInput = document.getElementById('claimsSearch');

        if (searchInput) {
          searchInput.value = '';
        }

        if (stream) {
          stream.innerHTML = '<div class="claims-loading">Loading ' + escapeHtml(lensId) + ' claims...</div>';
        }

        if (panel) {
          panel.innerHTML = '<div class="claims-loading">Loading queue context...</div>';
        }

        loadClaimsWorkspace(routeContext);

        return false;
      });
    });
  }

  function initializeClaimsSearch() {
    const searchInput = document.getElementById('claimsSearch');

    if (!searchInput) {
      return;
    }

    searchInput.addEventListener('input', function() {
      if (!activeClaimsWorkspacePayload) {
        return;
      }

      renderClaimsWorkspace(activeClaimsWorkspacePayload, searchInput.value || '');
    });
  }

  function markActiveLens_(activeLensId) {
    document.querySelectorAll('[data-lens]').forEach(function(button) {
      button.classList.toggle('is-active', button.getAttribute('data-lens') === activeLensId);
    });
  }

  function updateClaimsRouteContext_(routeContext) {
    const routeContextElement = document.getElementById('claimsRouteContext');

    if (!routeContextElement) {
      return;
    }

    const pseudoRoute = routeContext.claimId
      ? '?view=claimShell&claimId=' + encodeURIComponent(routeContext.claimId)
      : '?view=claimShell&lensId=' + encodeURIComponent(routeContext.lensId || 'all');
    routeContextElement.textContent = pseudoRoute;
  }

  function getClaimsCacheKey_(routeContext) {
    return [
      routeContext.lensId || 'all',
      routeContext.ownership || '',
      routeContext.condition || '',
      routeContext.claimId || ''
    ].join('|');
  }

  function loadClaimsWorkspace(routeContext) {
    routeContext = routeContext || {};
    activeClaimsRouteContext = routeContext;
    selectedClaimId = routeContext.claimId || '';

    const cacheKey = getClaimsCacheKey_(routeContext || {});
    const searchInput = document.getElementById('claimsSearch');
    const searchQuery = searchInput ? searchInput.value || '' : '';

    if (claimsWorkspaceCache[cacheKey]) {
      activeClaimsWorkspacePayload = claimsWorkspaceCache[cacheKey];
      renderClaimsWorkspace(activeClaimsWorkspacePayload, searchQuery);

      if (routeContext && routeContext.claimId) {
        loadClaimDetail(routeContext.claimId);
      }

      return;
    }

    google.script.run
      .withSuccessHandler(function(payload) {
        claimsWorkspaceCache[cacheKey] = payload;
        activeClaimsWorkspacePayload = payload;
        renderClaimsWorkspace(payload, searchQuery);

        if (routeContext && routeContext.claimId) {
          loadClaimDetail(routeContext.claimId);
        }
      })
      .withFailureHandler(handleClaimsWorkspaceError)
      .getClaimsWorkspacePageData(routeContext);
  }

  function renderClaimsWorkspace(payload, searchQuery) {
    const stream = document.getElementById('claimsStream');
    const claimsList = payload && payload.claimsList ? payload.claimsList : payload;
    const normalizedSearchQuery = String(searchQuery || '').trim();

    activeClaimsWorkspacePayload = payload;

    if (!claimsList || !Array.isArray(claimsList.groups)) {
      stream.innerHTML = '<div class="claims-empty-state">No claims returned.</div>';
      return;
    }

    updateLensCounts_(payload);

    const visibleClaimsList = filterClaimsListForSearch_(claimsList, normalizedSearchQuery);
    const visibleGroups = visibleClaimsList.groups || [];
    let html = '';

    if (!visibleGroups.length) {
      stream.innerHTML = '<div class="claims-empty-state">No claims match this search.</div>';
      renderQueueIntelligencePanel_(payload, visibleClaimsList, normalizedSearchQuery);
      return;
    }

    visibleGroups.forEach(function(group) {
      html += '<div class="claims-group">';
      html += '<div class="claims-group-header">';
      html += '<h3>' + escapeHtml(group.groupLabel || 'Claims') + '</h3>';
      html += '<span class="claims-group-count">' + escapeHtml((group.claims || []).length) + '</span>';
      html += '</div>';

      (group.claims || []).forEach(function(claim) {
        html += renderClaimRow_(claim);
      });

      html += '</div>';
    });

    stream.innerHTML = html;

    Array.prototype.forEach.call(
      stream.querySelectorAll('.claim-row'),
      function(row) {
        row.addEventListener('click', function() {
          const claimId = row.getAttribute('data-claim-id');
          const routeContext = {
            lensId: 'all',
            ownership: '',
            condition: '',
            claimId: claimId,
            compliance: ''
          };

          selectedClaimId = claimId;
          activeClaimsRouteContext = routeContext;
          markSelectedClaim_(claimId);
          updateClaimsRouteContext_(routeContext);
          window.history.pushState({ routeContext: routeContext }, '', buildClaimsRouteUrl_(routeContext));
          loadClaimDetail(claimId);
        });
      }
    );

    if (selectedClaimId) {
      markSelectedClaim_(selectedClaimId);
    } else if (!(activeClaimsRouteContext && activeClaimsRouteContext.claimId)) {
      renderQueueIntelligencePanel_(payload, visibleClaimsList, normalizedSearchQuery);
    }
  }

  function getClaimPreferredNumberFromListItem_(claim) {
    return claim.claimNumber ||
      claim.Claim_Number ||
      claim['Claim Number'] ||
      claim.jobNumber ||
      claim.Job_Number ||
      claim['Job Number'] ||
      '';
  }

  function renderClaimRow_(claim) {
    const openRequirements = getClaimOpenRequirementsForDisplay_(claim);
    const nextAction = getClaimNextActionForDisplay_(claim);
    const attentionReason = claim.attentionReason || claim.healthReason || '';
    const rowSeverityClass = getClaimRowSeverityClass_(claim.highestAlertSeverity);
    let html = '<div class="claim-row ' + rowSeverityClass + '" data-claim-id="' + escapeHtml(claim.claimId || '') + '">';

    html += '<div class="claim-row-identity"><strong>' +
      escapeHtml(claim.displayName || claim.claimId || '') +
      '</strong><br><span>' +
      escapeHtml(getClaimPreferredNumberFromListItem_(claim)) +
      '</span></div>';
    html += '<div class="claim-row-health">';
    html += '<span class="claim-row-health-pill">' + escapeHtml(claim.healthLevel || 'Unrated') + '</span>';
    html += '<span class="claim-row-owner">' + escapeHtml(claim.ownershipArea || 'Unassigned') + '</span>';
    html += '</div>';
    html += '<div class="claim-row-conditions">';
    html += renderClaimConditionPills_(claim.activeConditions || []);
    html += renderClaimOperationalAlertBadges_(claim);
    html += '</div>';

    if (openRequirements.length) {
      html += '<div class="claim-row-requirements">';
      html += '<span class="claim-row-label">Open Requirements</span>';
      html += '<strong>' + escapeHtml(openRequirements.slice(0, 2).join(' • ')) + '</strong>';

      if (openRequirements.length > 2) {
        html += '<small>+' + escapeHtml(openRequirements.length - 2) + ' more</small>';
      }

      html += '</div>';
    }

    if (nextAction) {
      html += '<div class="claim-row-action">';
      html += '<span class="claim-row-label">Next Action</span>';
      html += '<strong>' + escapeHtml(nextAction) + '</strong>';
      html += '</div>';
    }

    if (attentionReason) {
      html += '<div class="claim-row-attention"><span>Why:</span> ' + escapeHtml(attentionReason) + '</div>';
    }

    const displayLastActivity = getClaimDisplayLastActivity_(claim);

    if (displayLastActivity) {
      html += '<div class="claim-row-activity"><span>Last Activity</span> ' + escapeHtml(displayLastActivity) + '</div>';
    }

    html += '</div>';

    return html;
  }

  function getClaimDisplayLastActivity_(claim) {
    return claim.lastMeaningfulActivityAt ||
      claim.lastMeaningfulActivityDate ||
      claim.Last_Meaningful_Activity_At ||
      claim['Last Meaningful Activity At'] ||
      claim.lastActivityDate ||
      claim.Last_Activity_Date ||
      claim['Last Activity Date'] ||
      '';
  }

  function renderClaimConditionPills_(conditions) {
    const labels = (conditions || []).map(getClaimConditionLabel_).filter(Boolean);

    if (!labels.length) {
      return '<div class="claim-condition-empty">No active conditions</div>';
    }

    let html = '<div class="claim-condition-pills">';

    labels.slice(0, 2).forEach(function(label) {
      html += '<span class="claim-condition-pill">' + escapeHtml(label) + '</span>';
    });

    if (labels.length > 2) {
      html += '<span class="claim-condition-pill claim-condition-pill-overflow">+' +
        escapeHtml(labels.length - 2) +
        '</span>';
    }

    html += '</div>';

    return html;
  }

  function getClaimConditionLabel_(condition) {
    if (!condition || typeof condition !== 'object') {
      return condition || '';
    }

    return condition.Condition_Type ||
      condition.Condition_Name ||
      condition.conditionType ||
      condition.conditionName ||
      condition.Name ||
      '';
  }

  function getClaimRowSeverityClass_(severity) {
    const normalized = String(severity || '').toLowerCase();

    if (normalized === 'critical' || normalized === 'high') {
      return 'claim-row-has-high-alert';
    }

    if (normalized === 'medium') {
      return 'claim-row-has-medium-alert';
    }

    if (normalized === 'low' || normalized === 'info') {
      return 'claim-row-has-low-alert';
    }

    return '';
  }

  function updateLensCounts_(payload) {
    const counts = getLensCountsFromPayload_(payload);
    const lenses = Array.isArray(payload && payload.availableLenses)
      ? payload.availableLenses
      : [];

    document.querySelectorAll('[data-lens]').forEach(function(button) {
      const lensId = button.getAttribute('data-lens') || 'all';
      const lens = lenses.find(function(item) {
        return item.lensId === lensId;
      }) || {};
      const label = lens.lensName || button.getAttribute('data-lens-label') || button.textContent.trim();
      const count = counts[lensId];

      button.setAttribute('data-lens-label', label);
      button.innerHTML = '<span>' + escapeHtml(label) + '</span>' +
        (count !== undefined && count !== null
          ? '<span class="claims-lens-count">' + escapeHtml(count) + '</span>'
          : '');
    });

    markActiveLens_((activeClaimsRouteContext && activeClaimsRouteContext.lensId) || 'all');
  }

  function getLensCountsFromPayload_(payload) {
    const counts = Object.assign({}, payload && payload.lensCounts ? payload.lensCounts : {});

    if (Array.isArray(payload && payload.availableLenses)) {
      payload.availableLenses.forEach(function(lens) {
        if (lens && lens.lensId && lens.count !== undefined && lens.count !== null) {
          counts[lens.lensId] = lens.count;
        }
      });
    }

    return counts;
  }

  function filterClaimsListForSearch_(claimsList, searchQuery) {
    const query = String(searchQuery || '').trim().toLowerCase();

    if (!query) {
      return claimsList;
    }

    const terms = query.split(/\s+/).filter(Boolean);
    const filteredGroups = (claimsList.groups || []).map(function(group) {
      const filteredClaims = (group.claims || []).filter(function(claim) {
        return claimMatchesSearch_(claim, terms);
      });

      return Object.assign({}, group, {
        claims: filteredClaims
      });
    }).filter(function(group) {
      return (group.claims || []).length > 0;
    });

    return Object.assign({}, claimsList, {
      groups: filteredGroups,
      totalCount: filteredGroups.reduce(function(total, group) {
        return total + (group.claims || []).length;
      }, 0)
    });
  }

  function claimMatchesSearch_(claim, terms) {
    const searchableText = [
      claim.displayName,
      claim.customerName,
      claim.claimId,
      claim.jobNumber,
      claim.claimNumber,
      claim.address,
      claim.ownershipArea,
      claim.lifecycleState,
      claim.healthLevel,
      getSearchListText_(claim.activeConditions),
      getSearchAlertText_(claim.operationalAlerts),
      getSearchAlertText_(claim.activeAlerts),
      getSearchListText_(claim.openRequirements),
      claim.nextAction
    ].join(' ').toLowerCase();

    return terms.every(function(term) {
      return searchableText.indexOf(term) !== -1;
    });
  }

  function getSearchListText_(items) {
    return (items || []).map(function(item) {
      if (!item || typeof item !== 'object') {
        return item || '';
      }

      return Object.keys(item).map(function(key) {
        return item[key];
      }).join(' ');
    }).join(' ');
  }

  function getSearchAlertText_(alerts) {
    return (alerts || []).map(function(alert) {
      if (!alert || typeof alert !== 'object') {
        return alert || '';
      }

      return [
        alert.alertName,
        alert.alertType,
        alert.severity,
        alert.reason,
        alert.nextStep,
        alert.Alert_Name,
        alert.Alert_Type,
        alert.Severity,
        alert.Reason,
        alert.Recommended_Action
      ].filter(Boolean).join(' ');
    }).join(' ');
  }

  function renderQueueIntelligencePanel_(payload, visibleClaimsList, searchQuery) {
    const panel = document.getElementById('claimDetailPanel');

    if (!panel) {
      return;
    }

    const intelligence = payload && payload.queueIntelligence
      ? payload.queueIntelligence
      : buildClientQueueIntelligence_(visibleClaimsList || (payload && payload.claimsList));
    const viewLogic = intelligence.viewLogic || {};
    const stalestClaim = intelligence.stalestClaim || null;
    const visibleClaimCount = getVisibleClaimsCount_(visibleClaimsList || (payload && payload.claimsList));
    let html = '';

    html += '<div class="claim-detail-header">';
    html += '<h2>Queue Intelligence</h2>';
    html += '<div class="claim-detail-subtitle">' + escapeHtml(intelligence.lensName || viewLogic.lensName || 'Claims') + '</div>';
    html += '</div>';

    html += '<div class="claim-detail-section queue-intelligence-section">';
    html += '<h4>Queue Intelligence</h4>';
    html += '<div class="queue-metric-grid">';
    html += renderQueueMetric_('Needs Attention', intelligence.totalClaimsNeedingAttention || 0);
    html += renderQueueMetric_('Operational Alerts', intelligence.totalOperationalAlerts || 0);
    html += renderQueueMetric_('Missing Links', intelligence.missingLinkCount || 0);
    html += renderQueueMetric_('Visible Claims', visibleClaimCount);
    html += '</div>';

    if (stalestClaim) {
      html += '<div class="queue-stale-claim">';
      html += '<strong>Oldest Activity:</strong> ' + escapeHtml(stalestClaim.displayName || stalestClaim.claimId || 'Claim');

      if (stalestClaim.daysSinceMeaningfulActivity !== '' && stalestClaim.daysSinceMeaningfulActivity !== undefined) {
        html += ' · ' + escapeHtml(stalestClaim.daysSinceMeaningfulActivity) + ' days';
      }

      html += '</div>';
    }

    html += '</div>';

    html += '<div class="claim-detail-section">';
    html += '<h4>View Logic</h4>';
    html += '<div>' + escapeHtml(viewLogic.summary || ((intelligence.lensName || 'Claims') + ' lens')) + '</div>';

    if (searchQuery) {
      html += '<div class="queue-view-note">Search: ' + escapeHtml(searchQuery) + '</div>';
    }

    html += '</div>';

    html += '<div class="claim-detail-section ask-rainbow-placeholder">';
    html += '<h4>Ask Rainbow</h4>';
    html += '<div class="ask-rainbow-actions">';
    html += '<button type="button" disabled>Summarize Queue</button>';
    html += '<button type="button" disabled>Find Blockers</button>';
    html += '</div>';
    html += '</div>';

    panel.innerHTML = html;
  }

  function renderQueueMetric_(label, value) {
    return '<div class="queue-metric">' +
      '<strong>' + escapeHtml(value) + '</strong>' +
      '<span>' + escapeHtml(label) + '</span>' +
      '</div>';
  }

  function getVisibleClaimsCount_(claimsList) {
    return ((claimsList && claimsList.groups) || []).reduce(function(total, group) {
      return total + ((group.claims || []).length);
    }, 0);
  }

  function buildClientQueueIntelligence_(claimsList) {
    const claims = [];

    ((claimsList && claimsList.groups) || []).forEach(function(group) {
      claims.push.apply(claims, group.claims || []);
    });

    return {
      lensName: claimsList && claimsList.lensName || 'Claims',
      visibleClaimCount: claims.length,
      totalClaimsNeedingAttention: 0,
      totalOperationalAlerts: claims.reduce(function(total, claim) {
        return total + getClaimOperationalAlertCount_(claim, claim.operationalAlerts || []);
      }, 0),
      missingLinkCount: claims.reduce(function(total, claim) {
        return total + (claim.missingLinks || []).length;
      }, 0),
      stalestClaim: null,
      viewLogic: {
        lensName: claimsList && claimsList.lensName || 'Claims',
        summary: (claimsList && claimsList.lensName || 'Claims') + ' lens'
      }
    };
  }

  function renderClaimOperationalAlertBadges_(claim) {
    const alerts = Array.isArray(claim.operationalAlerts)
      ? claim.operationalAlerts
      : [];
    const alertCount = getClaimOperationalAlertCount_(claim, alerts);

    if (!alertCount) {
      return '';
    }

    const visibleAlerts = alerts.length
      ? alerts.slice(0, 2)
      : [{
        alertName: alertCount + ' alert' + (alertCount === 1 ? '' : 's'),
        severity: claim.highestAlertSeverity || ''
      }];
    let html = '<div class="claim-alert-badges">';

    visibleAlerts.forEach(function(alert) {
      html += '<span class="claim-alert-pill ' +
        getClaimOperationalAlertSeverityClass_(alert.severity || claim.highestAlertSeverity) +
        '">' +
        escapeHtml(alert.alertName || alert.alertType || 'Operational Alert') +
        '</span>';
    });

    if (alerts.length && alertCount > visibleAlerts.length) {
      html += '<span class="claim-alert-pill claim-alert-pill-overflow">+' +
        escapeHtml(alertCount - visibleAlerts.length) +
        ' more</span>';
    }

    html += '</div>';

    return html;
  }

  function getClaimOperationalAlertCount_(claim, alerts) {
    const parsedCount = Number(claim && claim.alertCount);
    const alertCount = isNaN(parsedCount) ? 0 : parsedCount;

    return Math.max(alertCount, alerts.length);
  }

  function getClaimOperationalAlertSeverityClass_(severity) {
    const normalized = String(severity || '').toLowerCase();

    if (normalized === 'critical') {
      return 'claim-alert-pill-critical';
    }

    if (normalized === 'high') {
      return 'claim-alert-pill-high';
    }

    if (normalized === 'low') {
      return 'claim-alert-pill-low';
    }

    if (normalized === 'info') {
      return 'claim-alert-pill-info';
    }

    return 'claim-alert-pill-medium';
  }

  function getClaimOpenRequirementsForDisplay_(claim) {
    if (claim && Array.isArray(claim.openRequirements) && claim.openRequirements.length) {
      return claim.openRequirements;
    }

    return [];
  }

  function getClaimNextActionForDisplay_(claim) {
    if (claim && claim.nextAction) {
      return claim.nextAction;
    }

    return '';
  }

  function markSelectedClaim_(claimId) {
    document.querySelectorAll('.claim-row').forEach(function(row) {
      const isSelected = row.getAttribute('data-claim-id') === claimId;

      row.classList.toggle('is-selected', isSelected);

      if (isSelected) {
        row.style.borderColor = 'rgba(157, 105, 153, 0.46)';
        row.style.boxShadow = '0 16px 38px rgba(84, 55, 86, 0.13)';
        row.style.background = 'rgba(255,255,255,0.99)';
      } else {
        row.style.borderColor = '';
        row.style.boxShadow = '';
        row.style.background = '';
      }
    });
  }

  function loadClaimDetail(claimId) {
    markSelectedClaim_(claimId);

    const panel = document.getElementById('claimDetailPanel');
    if (panel) {
      panel.innerHTML = '<div class="claims-loading">Loading claim detail...</div>';
    }

    google.script.run
      .withSuccessHandler(renderClaimDetail)
      .withFailureHandler(handleClaimsWorkspaceError)
      .getClaimDetailPageData(claimId);
  }

  function getClaimPreferredNumberFromDetail_(detail) {
    const header = detail && detail.claimHeader ? detail.claimHeader : {};

    return header.claimNumber ||
      header.Claim_Number ||
      header['Claim Number'] ||
      detail.claimNumber ||
      detail.Claim_Number ||
      detail['Claim Number'] ||
      header.jobNumber ||
      header.Job_Number ||
      header['Job Number'] ||
      detail.jobNumber ||
      detail.Job_Number ||
      detail['Job Number'] ||
      detail.claimId ||
      '';
  }

  function renderClaimDetail(detail) {
    const panel = document.getElementById('claimDetailPanel');

    if (!detail) {
      panel.innerHTML = '<div class="claims-empty-state">No claim detail returned.</div>';
      return;
    }

    const header = detail.claimHeader || {};
    const operational = detail.operationalContext || {};
    const links = detail.externalLinks || [];
    const workflows = detail.relatedWorkflows || [];
    const timelineEvents = getRecentTimelineEvents_(detail);
    const detailAlerts = getClaimDetailOperationalAlerts_(detail, header);
    const operationalLinkState = getClaimOperationalLinkState_(links);

    const detailClaimSummary = {
      claimId: detail.claimId || header.claimId || '',
      healthLevel: header.healthLevel || '',
      healthReason: header.healthReason || operational.healthReason || '',
      ownershipArea: header.ownershipArea || '',
      lifecycleState: header.lifecycleState || '',
      activeConditions: header.activeConditions || [],
      openRequirements: header.openRequirements || operational.openRequirements || [],
      nextAction: header.nextAction || operational.nextAction || '',
      attentionReason: header.attentionReason || operational.attentionReason || header.healthReason || operational.healthReason || '',
      operationalAlerts: detailAlerts,

  function getClaimOperationalLinkState_(links) {
    const state = {
      fusion: { label: 'Fusion', url: '', status: 'Missing' },
      estimate: { label: 'XA / Symbility', url: '', status: 'Missing' },
      claimx: { label: 'ClaimX', url: '', status: 'Missing' },
      drive: { label: 'Drive Folder', url: '', status: 'Missing' }
    };

    (links || []).forEach(function(link) {
      const linkType = String(link.linkType || link.Link_Type || link.type || '').toLowerCase();
      const label = String(link.label || link.Label || '').toLowerCase();
      const combined = linkType + ' ' + label;
      const url = getExternalLinkUrl_(link);
      const fusionUrl = link.Fusion_URL || link.fusionUrl || link['Fusion URL'] || '';
      const driveUrl = link.Drive_Folder || link.driveFolder || link['Drive Folder'] || '';
      const xactUrl = link.XactAnalysis || link.XactAnalysis_URL || link.xactAnalysisUrl || link.Xactimate_URL || link.xactimateUrl || '';
      const symbilityUrl = link.Symbility || link.Symbility_URL || link.symbilityUrl || '';
      const claimXUrl = link.ClaimX || link.ClaimX_URL || link.claimXUrl || '';

      if (fusionUrl) {
        state.fusion.url = fusionUrl;
        state.fusion.status = 'Linked';
      }

      if (driveUrl) {
        state.drive.url = driveUrl;
        state.drive.status = 'Linked';
      }

      if (xactUrl || symbilityUrl) {
        state.estimate.url = xactUrl || symbilityUrl;
        state.estimate.status = 'Linked';
      }

      if (claimXUrl) {
        state.claimx.url = claimXUrl;
        state.claimx.status = 'Linked';
      }

      if (!url) {
        return;
      }

      if (combined.indexOf('fusion') !== -1) {
        state.fusion.url = url;
        state.fusion.status = 'Linked';
      } else if (combined.indexOf('xact') !== -1 || combined.indexOf('symbility') !== -1 || combined === 'xa') {
        state.estimate.url = url;
        state.estimate.status = 'Linked';
      } else if (combined.indexOf('claimx') !== -1 || combined.indexOf('claim x') !== -1) {
        state.claimx.url = url;
        state.claimx.status = 'Linked';
      } else if (combined.indexOf('drive') !== -1 || combined.indexOf('folder') !== -1) {
        state.drive.url = url;
        state.drive.status = 'Linked';
      }
    });

    return state;
  }

  function groupFullClaimTimelineEvents_(events) {
    const groupOrder = [
      'Revision / Insurance Activity',
      'Field / EOJ Activity',
      'Notes & Communication',
      'Accounting / Payment Activity',
      'System Activity',
      'Other Activity'
    ];
    const grouped = {};

    events.forEach(function(event) {
      const groupLabel = getFullClaimTimelineGroupLabel_(event);

      if (!grouped[groupLabel]) {
        grouped[groupLabel] = [];
      }

      grouped[groupLabel].push(event);
    });

    return groupOrder
      .filter(function(label) {
        return grouped[label] && grouped[label].length;
      })
      .map(function(label) {
        return {
          label: label,
          events: grouped[label]
        };
      });
  }

  function getFullClaimTimelineGroupLabel_(event) {
    const eventType = String(getTimelineEventType_(event) || '').toLowerCase();
    const source = String(getTimelineEventSource_(event) || '').toLowerCase();
    const summary = String(getTimelineEventSummary_(event) || '').toLowerCase();
    const combined = [eventType, source, summary].join(' ');

    if (combined.indexOf('revision') !== -1 ||
        combined.indexOf('estimate') !== -1 ||
        combined.indexOf('carrier') !== -1 ||
        combined.indexOf('xact') !== -1 ||
        combined.indexOf('symbility') !== -1 ||
        combined.indexOf('insurance') !== -1) {
      return 'Revision / Insurance Activity';
    }

    if (combined.indexOf('eoj') !== -1 ||
        combined.indexOf('field') !== -1 ||
        combined.indexOf('monitor') !== -1 ||
        combined.indexOf('inspection') !== -1 ||
        combined.indexOf('technician') !== -1 ||
        combined.indexOf('calendar') !== -1) {
      return 'Field / EOJ Activity';
    }

    if (combined.indexOf('payment') !== -1 ||
        combined.indexOf('remittance') !== -1 ||
        combined.indexOf('accounting') !== -1 ||
        combined.indexOf('invoice') !== -1 ||
        combined.indexOf('paid') !== -1) {
      return 'Accounting / Payment Activity';
    }

    if (combined.indexOf('system') !== -1 ||
        combined.indexOf('health') !== -1 ||
        combined.indexOf('condition') !== -1 ||
        combined.indexOf('alert') !== -1 ||
        combined.indexOf('intelligence') !== -1) {
      return 'System Activity';
    }

    if (combined.indexOf('note') !== -1 ||
        combined.indexOf('email') !== -1 ||
        combined.indexOf('historical') !== -1 ||
        combined.indexOf('communication') !== -1) {
      return 'Notes & Communication';
    }

    return 'Other Activity';
  }


  function renderFullClaimTimelineItem_(event) {
    const eventType = getTimelineEventType_(event) || 'Activity';
    const source = getTimelineEventSource_(event);
    const detail = getTimelineEventDetail_(event);
    const rawSummary = getTimelineEventSummary_(event);
    const summary = normalizeTimelineTitle_(rawSummary);
    const date = getTimelineEventDate_(event);
    const actor = event.actor || event.Actor || '';
    const metaItems = [eventType, source, actor].filter(Boolean);
    let html = '<article class="full-claim-timeline-item">';

    html += '<div class="full-claim-timeline-marker"></div>';
    html += '<div class="full-claim-timeline-body">';
    html += '<div class="full-claim-timeline-topline">';
    html += '<span>' + escapeHtml(date || 'Undated') + '</span>';
    html += '<span>' + escapeHtml(metaItems.join(' • ')) + '</span>';
    html += '</div>';
    html += '<h3>' + escapeHtml(summary) + '</h3>';

    if (detail && detail !== rawSummary) {
      html += '<p>' + escapeHtml(detail) + '</p>';
    }

    html += '</div>';
    html += '</article>';

    return html;
  }

  function normalizeTimelineTitle_(value) {
    const text = String(value || '').trim();

    if (!text) {
      return 'Timeline Event';
    }

    const letters = text.replace(/[^A-Za-z]/g, '');
    const uppercaseLetters = text.replace(/[^A-Z]/g, '');
    const isMostlyUppercase = letters.length > 12 && uppercaseLetters.length / letters.length > 0.72;

    if (!isMostlyUppercase) {
      return text;
    }

    return text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
  }

    html += '<h3>Active Conditions</h3>';

    if (conditions.length) {
      html += '<div class="full-claim-chip-list">';
      conditions.forEach(function(condition) {
        html += '<span class="claim-pill claim-pill-condition">' + escapeHtml(getClaimConditionLabel_(condition)) + '</span>';
      });
      html += '</div>';
    } else {
      html += '<div class="full-claim-muted">No active conditions.</div>';
    }

    html += '</section>';
    return html;
  }

  function renderFullClaimAlertsCard_(alerts) {
    let html = '<section class="full-claim-card">';
    html += '<h3>Active Alerts</h3>';

    if (alerts.length) {
      alerts.forEach(function(alert) {
        html += '<div class="claim-detail-alert">';
        html += '<strong>' + escapeHtml(alert.alertName || alert.alertType || 'Operational Alert') + '</strong>';
        if (alert.reason) {
          html += '<div class="claim-detail-alert-reason">' + escapeHtml(alert.reason) + '</div>';
        }
        html += '</div>';
      });
    } else {
      html += '<div class="full-claim-muted">No active alerts.</div>';
    }

    html += '</section>';
    return html;
  }

  function renderFullClaimNextActionCard_(nextAction) {
    let html = '<section class="full-claim-card">';
    html += '<h3>Next Action</h3>';
    html += nextAction
      ? '<div class="full-claim-next-action">' + escapeHtml(nextAction) + '</div>'
      : '<div class="full-claim-muted">No immediate action detected.</div>';
    html += '</section>';
    return html;
  }

  function renderFullClaimQuickActionsCard_(links) {
    let html = '<section class="full-claim-card">';
    html += '<h3>Quick Actions</h3>';
    html += '<div class="full-claim-action-list">';

    if (links.length) {
      links.forEach(function(link) {
        const label = getExternalLinkDisplayLabel_(link);
        const url = link.url || '';

        if (url) {
          html += '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(label) + '</a>';
        }
      });
    }

    html += '<button type="button" disabled>Create Todoist Task</button>';
    html += '<button type="button" disabled>Add Note</button>';
    html += '</div>';
    html += '</section>';
    return html;
  }

  function renderFullClaimFinancialsCard_(detail) {
    const financialTracks = detail.financialTracks || detail.financialSummary || [];
    let html = '<section class="full-claim-card">';
    html += '<h3>Compact Financials</h3>';

    if (Array.isArray(financialTracks) && financialTracks.length) {
      financialTracks.slice(0, 3).forEach(function(track) {
        html += '<div class="full-claim-financial-row">';
        html += '<strong>' + escapeHtml(track.name || track.trackName || track.type || 'Financial Track') + '</strong>';
        html += '<span>' + escapeHtml(track.status || track.approvalStatus || track.paymentStatus || '') + '</span>';
        html += '</div>';
      });
    } else {
      html += '<div class="full-claim-muted">Financial tracks will appear here when available.</div>';
    }

    html += '</section>';
    return html;
  }

  function renderFullClaimAiCard_() {
    let html = '<section class="full-claim-card">';
    html += '<h3>Ask Rainbow</h3>';
    html += '<div class="full-claim-ai-prompts">';
    html += '<button type="button" disabled>What is blocking this claim?</button>';
    html += '<button type="button" disabled>Summarize recent activity</button>';
    html += '<button type="button" disabled>Explain revision status</button>';
    html += '<button type="button" disabled>Draft follow-up email</button>';
    html += '</div>';
    html += '</section>'; 
    return html;
  }

  function renderClaimTimelineItem_(event) {
    const eventType = getTimelineEventType_(event);
    const source = getTimelineEventSource_(event);
    const detail = getTimelineEventDetail_(event);
    const summary = getTimelineEventSummary_(event);
    const isHistoricalNote = eventType.toLowerCase() === 'historical note' || source.toLowerCase() === 'historical notes';
    let html = '<div class="claim-detail-timeline-item' + (isHistoricalNote ? ' claim-detail-timeline-item-note' : '') + '">';

    html += '<div>' + escapeHtml(summary) + '</div>';

    if (detail && detail !== summary) {
      html += '<div class="claim-detail-timeline-detail">' + escapeHtml(detail) + '</div>';
    }

    html += '<small>' + escapeHtml(getTimelineEventMeta_(event)) + '</small>';
    html += '</div>';

    return html;
  }

  function renderClaimDetailKeyValue_(label, value) {
    if (!value) {
      return '';
    }

    return '<div class="claim-detail-key-value">' +
      '<span>' + escapeHtml(label) + '</span>' +
      '<strong>' + escapeHtml(value) + '</strong>' +
      '</div>';
  }

  function getClaimDetailOperationalAlerts_(detail, header) {
    if (header && Array.isArray(header.operationalAlerts)) {
      return header.operationalAlerts;
    }

    if (detail && Array.isArray(detail.operationalAlerts)) {
      return detail.operationalAlerts;
    }

    return [];
  }

  function getExternalLinkDisplayLabel_(link) {
    const linkType = String(link.linkType || '').toLowerCase();
    const friendlyLabels = {
      drive: 'Google Drive Folder',
      fusion: 'Fusion File',
      xactanalysis: 'XactAnalysis',
      xactimate: 'Xactimate',
      symbility: 'Symbility',
      claimx: 'ClaimX'
    };

    if (friendlyLabels[linkType]) {
      return friendlyLabels[linkType];
    }

    return link.label || link.linkType || 'Operational Link';
  }

  function getRecentTimelineEvents_(detail) {
    if (!detail) {
      return [];
    }

    if (detail.timelineSection && Array.isArray(detail.timelineSection.recentEvents)) {
      return detail.timelineSection.recentEvents;
    }

    if (detail.timelineSection && Array.isArray(detail.timelineSection.events)) {
      return detail.timelineSection.events;
    }

    if (Array.isArray(detail.recentTimelineEvents)) {
      return detail.recentTimelineEvents;
    }

    if (detail.activitySummary) {
      return [{
        summary: detail.activitySummary.lastActivitySummary || detail.activitySummary.lastActivityType || 'Recent claim activity',
        eventDate: detail.activitySummary.lastActivityDate || ''
      }];
    }

    return [];
  }

  function getTimelineEventSummary_(event) {
    return event.summary ||
      event.Summary ||
      event.title ||
      event.eventSummary ||
      event.description ||
      event.lastActivitySummary ||
      event.activitySummary ||
      event.detail ||
      event.details ||
      event.Details ||
      'Timeline Event';
  }

  function getTimelineEventDate_(event) {
    const rawDate = event.eventDate || event.date || event.Date || event.createdAt || event.timestamp || '';

    if (!rawDate) {
      return '';
    }

    const date = new Date(rawDate);

    if (isNaN(date.getTime())) {
      return rawDate;
    }

    return date.toLocaleDateString(undefined, {
      month: 'short',
      day: 'numeric',
      year: 'numeric'
    });
  }

  function getTimelineEventMeta_(event) {
    return [
      getTimelineEventDate_(event),
      getTimelineEventType_(event),
      getTimelineEventSource_(event),
      event.actor || event.Actor || ''
    ].filter(Boolean).join(' • ');
  }

  function getTimelineEventType_(event) {
    return event.eventType || event.type || event['Event Type'] || event.Event_Type || '';
  }

  function getTimelineEventSource_(event) {
    return event.source || event.sourceSystem || event.Source || event.Source_System || '';
  }

  function getTimelineEventDetail_(event) {
    return event.detail || event.details || event.Details || event.description || '';
  }

  function handleClaimsWorkspaceError(error) {
    const stream = document.getElementById('claimsStream');
    const panel = document.getElementById('claimDetailPanel');
    const message = error && error.message ? error.message : String(error);

    if (stream) {
      stream.innerHTML = '<div class="claims-empty-state">Claims Workspace error: ' +
        escapeHtml(message) +
        '</div>';
    }

    if (panel) {
      panel.innerHTML = '<div class="claims-empty-state">Unable to load claim detail.</div>';
    }
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
</script>
