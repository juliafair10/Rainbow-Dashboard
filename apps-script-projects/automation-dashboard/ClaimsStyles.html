<style>
  .claims-shell {
    min-height: 100vh;
    padding: 28px;
    background: linear-gradient(135deg, #fff7fb 0%, #fbf8ff 45%, #f8fbff 100%);
    color: #211827;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .claims-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 22px;
  }

  .claims-header h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 0;
  }

  .claims-route-context {
    display: none;
  }

  .claims-lenses {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .claims-lenses button {
    display: inline-flex;
    gap: 8px;
    align-items: center;
    cursor: pointer;
    padding: 9px 14px;
    border: 1px solid rgba(77, 53, 80, 0.16);
    border-radius: 999px;
    background: rgba(255,255,255,0.75);
    box-shadow: 0 6px 18px rgba(0,0,0,0.035);
    font-size: 13px;
  }

  .claims-lenses button.is-active {
    border-color: rgba(157, 105, 153, 0.34);
    background: rgba(255,255,255,0.95);
    box-shadow: 0 8px 22px rgba(84, 55, 86, 0.07);
  }

  .claims-lens-count {
    min-width: 22px;
    padding: 2px 6px;
    border-radius: 999px;
    background: rgba(238, 224, 242, 0.72);
    color: rgba(33, 24, 39, 0.62);
    font-size: 11px;
    font-weight: 650;
    text-align: center;
  }

  .claims-search {
    margin-bottom: 18px;
  }

  .claims-search input {
    width: 100%;
    max-width: 460px;
    padding: 12px 14px;
    border: 1px solid rgba(77, 53, 80, 0.16);
    border-radius: 14px;
    background: rgba(255,255,255,0.85);
    font-size: 14px;
  }

  .claims-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 390px;
    gap: 20px;
    align-items: start;
  }

  .claims-stream,
  .claim-detail-panel {
    min-height: 540px;
    border: 1px solid rgba(77, 53, 80, 0.10);
    border-radius: 24px;
    padding: 20px;
    background: rgba(255,255,255,0.78);
    box-shadow: 0 18px 44px rgba(84, 55, 86, 0.08);
    backdrop-filter: blur(10px);
  }

  .claim-detail-panel {
    position: sticky;
    top: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .claims-group {
    margin-bottom: 28px;
    padding: 14px;
    border-radius: 22px;
    background: rgba(255,255,255,0.52);
    border: 1px solid rgba(77, 53, 80, 0.06);
  }

  .claims-group-header {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
    margin-bottom: 14px;
  }

  .claims-group-header h3 {
    margin: 0;
    font-size: 16px;
    letter-spacing: 0;
  }

  .claims-group-header p {
    margin: 4px 0 0 0;
    color: rgba(33, 24, 39, 0.58);
    font-size: 12px;
  }

  .claims-group-count {
    min-width: 28px;
    padding: 5px 9px;
    border-radius: 999px;
    background: rgba(238, 224, 242, 0.75);
    color: rgba(33, 24, 39, 0.7);
    font-size: 12px;
    text-align: center;
  }

  .claim-row {
    display: grid;
    grid-template-columns: minmax(150px, 1.05fr) minmax(170px, 1.25fr) minmax(250px, 1.9fr) minmax(190px, 1.35fr);
    gap: 12px 18px;
    align-items: start;
    border: 1px solid rgba(77, 53, 80, 0.10);
    border-left-width: 3px;
    border-radius: 18px;
    padding: 14px 16px;
    margin-bottom: 11px;
    cursor: pointer;
    background: rgba(255,255,255,0.94);
    box-shadow: 0 8px 22px rgba(84, 55, 86, 0.045);
    transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
  }

  .claim-row-has-high-alert {
    border-left-color: rgba(164, 70, 78, 0.46);
  }

  .claim-row-has-medium-alert {
    border-left-color: rgba(155, 113, 44, 0.34);
  }

  .claim-row-has-low-alert {
    border-left-color: rgba(93, 107, 117, 0.22);
  }


  .claim-row:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 30px rgba(84, 55, 86, 0.08);
    border-color: rgba(157, 105, 153, 0.28);
  }

  .claim-row > div {
    min-width: 0;
    font-size: 13px;
    line-height: 1.28;
    color: rgba(33, 24, 39, 0.78);
  }

  .claim-row-identity {
    grid-column: 1;
    grid-row: 1 / span 3;
    font-size: 14px;
    line-height: 1.18;
  }

  .claim-row-identity strong {
    display: block;
    margin-bottom: 3px;
  }

  .claim-row-identity span {
    color: rgba(33, 24, 39, 0.54);
    font-size: 12px;
  }

  .claim-row-health {
    grid-column: 2;
    grid-row: 1;
    display: flex;
    gap: 7px;
    align-items: center;
    flex-wrap: wrap;
  }

  .claim-row-health-pill {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding: 4px 8px;
    border-radius: 999px;
    background: rgba(232, 240, 255, 0.78);
    color: rgba(33, 24, 39, 0.72);
    font-size: 11px;
    font-weight: 700;
  }

  .claim-row-owner {
    color: rgba(33, 24, 39, 0.58);
    font-size: 12px;
  }

  .claim-row-conditions {
    grid-column: 2;
    grid-row: 2 / span 2;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-start;
  }

  .claim-condition-pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .claim-condition-pill,
  .claim-condition-empty {
    display: inline-flex;
    max-width: 170px;
    min-height: 22px;
    align-items: center;
    padding: 4px 7px;
    border-radius: 999px;
    background: rgba(242, 233, 250, 0.82);
    color: rgba(33, 24, 39, 0.64);
    font-size: 11px;
    line-height: 1.1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .claim-condition-empty {
    background: transparent;
    padding-left: 0;
    color: rgba(33, 24, 39, 0.48);
  }

  .claim-condition-pill-overflow {
    max-width: none;
    background: rgba(244, 238, 247, 0.68);
  }

  .claim-row-requirements {
    grid-column: 3;
    grid-row: 1 / span 2;
    padding: 11px 12px;
    border-radius: 14px;
    background: rgba(255,255,255,0.72);
    border: 1px solid rgba(77, 53, 80, 0.06);
  }

  .claim-row-label {
    display: block;
    margin-bottom: 4px;
    color: rgba(33, 24, 39, 0.48);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .claim-row-requirements strong,
  .claim-row-action strong {
    display: block;
    font-weight: 700;
  }

  .claim-row-requirements small {
    display: block;
    margin-top: 4px;
    color: rgba(33, 24, 39, 0.52);
    font-size: 11px;
  }

  .claim-row-action {
    grid-column: 4;
    grid-row: 1;
    padding-top: 2px;
  }

  .claim-row-attention {
    grid-column: 4;
    grid-row: 2;
    color: rgba(33, 24, 39, 0.62);
    display: -webkit-box;
    overflow: hidden;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }

  .claim-row-attention span,
  .claim-row-activity span {
    color: rgba(33, 24, 39, 0.46);
    font-weight: 700;
  }

  .claim-row-activity {
    grid-column: 4;
    grid-row: 3;
    color: rgba(33, 24, 39, 0.56);
    font-size: 12px;
  }

  .claim-alert-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 100%;
  }

  .claim-alert-pill {
    display: inline-block;
    max-width: 158px;
    padding: 4px 7px;
    border: 1px solid rgba(77, 53, 80, 0.10);
    border-radius: 999px;
    background: rgba(250, 247, 252, 0.78);
    color: rgba(33, 24, 39, 0.64);
    font-size: 11px;
    font-weight: 650;
    line-height: 1.12;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .claim-alert-pill-critical,
  .claim-alert-pill-high {
    border-color: rgba(164, 70, 78, 0.18);
    background: rgba(255, 239, 239, 0.74);
    color: rgba(100, 42, 49, 0.74);
  }

  .claim-alert-pill-medium {
    border-color: rgba(155, 113, 44, 0.16);
    background: rgba(255, 249, 235, 0.78);
    color: rgba(92, 66, 30, 0.72);
  }

  .claim-alert-pill-low,
  .claim-alert-pill-info,
  .claim-alert-pill-overflow {
    border-color: rgba(93, 107, 117, 0.13);
    background: rgba(244, 248, 247, 0.78);
    color: rgba(48, 62, 68, 0.62);
  }

  .claim-alert-pill-overflow {
    max-width: none;
  }

  .claim-pill {
    padding: 5px 8px;
    border-radius: 999px;
    background: rgba(244, 238, 247, 0.85);
    color: rgba(33, 24, 39, 0.68);
    font-size: 11px;
  }

  .claim-pill-condition {
    background: rgba(242, 233, 250, 0.95);
  }

  .claim-row.is-selected {
    border-color: rgba(157, 105, 153, 0.46);
    box-shadow: 0 16px 38px rgba(84, 55, 86, 0.13);
    background: rgba(255,255,255,0.99);
  }

  .claim-detail-header {
    margin-bottom: 4px;
    padding: 4px 2px 8px;
  }

  .claim-detail-header h2 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 0;
  }

  .claim-detail-subtitle {
    margin-top: 4px;
    color: rgba(33, 24, 39, 0.58);
    font-size: 13px;
  }

  .claim-detail-section {
    margin-top: 0;
    padding: 15px;
    border-radius: 18px;
    background: rgba(255,255,255,0.78);
    border: 1px solid rgba(77, 53, 80, 0.08);
    box-shadow: 0 8px 24px rgba(84, 55, 86, 0.045);
  }

  .claim-detail-section h4 {
    margin: 0 0 11px 0;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(33, 24, 39, 0.58);
  }

  .claim-detail-key-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .claim-detail-key-value {
    padding: 9px 10px;
    border-radius: 12px;
    background: rgba(250, 247, 252, 0.70);
    border: 1px solid rgba(77, 53, 80, 0.05);
  }

  .claim-detail-key-value span {
    display: block;
    color: rgba(33, 24, 39, 0.50);
    font-size: 11px;
    font-weight: 700;
  }

  .claim-detail-key-value strong {
    display: block;
    margin-top: 2px;
    font-size: 13px;
  }

  .claim-detail-section div,
  .claim-detail-section a {
    font-size: 13px;
    line-height: 1.48;
  }

  .claim-detail-section a {
    color: inherit;
    text-decoration: none;
    font-weight: 650;
  }

  .claim-detail-section a:hover {
    text-decoration: underline;
  }

  .claim-detail-pill-row {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 10px;
  }

  .claim-detail-alert {
    padding: 9px 0;
    border-top: 1px solid rgba(77, 53, 80, 0.08);
  }

  .claim-detail-alert:first-of-type {
    padding-top: 0;
    border-top: 0;
  }

  .claim-detail-alert-title {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
    margin-bottom: 4px;
  }

  .claim-detail-alert small {
    display: block;
    margin-top: 3px;
    color: rgba(33, 24, 39, 0.58);
  }

  .claim-detail-alert-reason {
    color: rgba(33, 24, 39, 0.68);
  }

  .claim-detail-next-step {
    padding: 9px 0;
    border-top: 1px solid rgba(77, 53, 80, 0.08);
  }

  .claim-detail-next-step:first-of-type {
    padding-top: 0;
    border-top: 0;
  }

  .claim-detail-next-step strong {
    display: block;
    margin-bottom: 4px;
  }

  .claim-detail-link-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .claim-detail-link {
    display: inline-flex;
    align-items: center;
    min-height: 28px;
    padding: 6px 9px;
    border-radius: 999px;
    border: 1px solid rgba(77, 53, 80, 0.10);
    background: rgba(250, 247, 252, 0.78);
    color: rgba(33, 24, 39, 0.72);
    font-size: 12px;
    font-weight: 650;
    text-decoration: none;
  }

  .claim-detail-link:hover {
    text-decoration: none;
    border-color: rgba(157, 105, 153, 0.24);
  }

  .claim-detail-link.is-disabled {
    opacity: 0.62;
  }

  .queue-metric-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .queue-metric {
    padding: 10px;
    border-radius: 14px;
    background: rgba(250, 247, 252, 0.74);
    border: 1px solid rgba(77, 53, 80, 0.06);
  }

  .queue-metric strong {
    display: block;
    font-size: 20px;
    line-height: 1;
  }

  .queue-metric span,
  .queue-view-note {
    display: block;
    margin-top: 4px;
    color: rgba(33, 24, 39, 0.58);
    font-size: 12px;
  }

  .queue-stale-claim {
    margin-top: 11px;
    color: rgba(33, 24, 39, 0.68);
  }

  .ask-rainbow-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .ask-rainbow-actions button {
    padding: 7px 10px;
    border: 1px solid rgba(77, 53, 80, 0.10);
    border-radius: 999px;
    background: rgba(255,255,255,0.68);
    color: rgba(33, 24, 39, 0.52);
    font-size: 12px;
  }

  .claim-detail-timeline-item {
    padding: 8px 0;
    border-top: 1px solid rgba(77, 53, 80, 0.08);
  }

  .claim-detail-timeline-item:first-of-type {
    border-top: 0;
  }

  .claim-detail-timeline-item small {
    display: block;
    margin-top: 2px;
    color: rgba(33, 24, 39, 0.54);
  }

  .claim-detail-timeline-item-note {
    margin: 8px 0;
    padding: 10px 11px;
    border-top: 0;
    border-radius: 14px;
    background: rgba(255, 248, 252, 0.82);
    border: 1px solid rgba(157, 105, 153, 0.12);
  }

  .claim-detail-timeline-item-note:first-of-type {
    border-top: 1px solid rgba(157, 105, 153, 0.12);
  }

  .claim-detail-timeline-detail {
    margin-top: 5px;
    color: rgba(33, 24, 39, 0.66);
    font-size: 12px;
    line-height: 1.42;
  }

  .claims-loading,
  .claims-empty-state {
    opacity: 0.68;
  }

  @media (max-width: 1180px) {
    .claims-layout {
      grid-template-columns: minmax(0, 1fr);
    }

    .claim-detail-panel {
      position: static;
    }
  }

  @media (max-width: 820px) {
    .claims-shell {
      padding: 18px;
    }

    .claim-row {
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
    }

    .claim-row-identity,
    .claim-row-health,
    .claim-row-conditions,
    .claim-row-requirements,
    .claim-row-action,
    .claim-row-attention,
    .claim-row-activity {
      grid-column: 1;
      grid-row: auto;
    }

    .claim-detail-key-grid,
    .queue-metric-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
